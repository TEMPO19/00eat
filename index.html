// 历史菜单：最近一周的点餐记录
// =========================================================

function renderHistory() {
  const box = document.getElementById('history-box');
  const btn = document.getElementById('toggle-history-btn');
  box.classList.toggle('hidden');
  btn.textContent = box.classList.contains('hidden') ? '查看一周' : '收起';
  if (box.classList.contains('hidden')) return;

  const list = document.getElementById('history-list');
  // 最近 7 天（含今天），从早到晚
  const days = [];
  for (let i = -6; i <= 0; i++) days.push(shiftDate(todayStr(), i));

  // 按日期归拢，超出 7 天的记录直接忽略
  const byDate = new Map(days.map(d => [d, []]));
  state.orders.forEach(o => {
    if (byDate.has(o.order_date)) byDate.get(o.order_date).push(o);
  });

  // 只显示有记录的日期，避免顶部出现一串空日期
  const shown = days.filter(d => byDate.get(d).length);
  if (!shown.length) {
    list.innerHTML = `<div class="empty" style="padding:20px">最近 7 天还没有点餐记录</div>`;
    return;
  }

  list.innerHTML = shown.reverse().map(date => {
    const items = byDate.get(date);
    // 同餐次聚在一起，更接近一天实际吃了什么
    const bySlot = {};
    items.forEach(o => { (bySlot[o.slot] = bySlot[o.slot] || []).push(o); });
    const groups = SLOTS.filter(s => bySlot[s]).map(s =>
      `<div class="his-slot">
         <span class="his-slot-name">${s}</span>
         <span class="his-dishes">${bySlot[s].map(o => escapeHtml(o.dish_name || '未命名')).join('、')}</span>
       </div>`).join('');

    return `<div class="his-day">
        <div class="his-date">${escapeHtml(prettyDate(date))}<span class="his-count">${items.length} 道</span></div>
        ${groups}
      </div>`;
  }).join('');
}

document.getElementById('toggle-history-btn').addEventListener('click', renderHistory);

document.addEventListener('click', async e => {
  // 菜单管理分页：‹ › 与页码。disabled 按钮不会派发 click，这里再兜一层
  const pg = e.target.closest('#menu-pager [data-pg]');
  if (pg && !pg.disabled) {
    state.menuPage = parseInt(pg.dataset.pg, 10) || 1;
    renderMenu();
    // 翻页后回到列表顶部，否则停在页面底部看不到新的一页
    const list = document.getElementById('menu-list');
    if (list) {
      const top = list.getBoundingClientRect().top + window.scrollY - 12;
      window.scrollTo({ top, behavior: 'smooth' });
    }
    return;
  }

  // 首页两张小卡片分页（今日饮品 / 灵感咕）：固定两行翻页
  const mpg = e.target.closest('[data-mpg]');
  if (mpg && !mpg.disabled) {
    const p = parseInt(mpg.dataset.mpg, 10) || 1;
    // data-mpg 在两个分页条里都有，靠所在容器区分改哪个 state
    if (mpg.closest('#drink-pager')) state.drinkPage = p;
    else state.wishPage = p;
    renderHome();
    return;
  }

  const d = e.target.closest('[data-del-order]');
  if (d) return deleteOrder(d.dataset.delOrder);

  // 饮品视图底部的「添加饮品」：跳加菜页并定位到饮品标签
  if (e.target.closest('[data-drink-add]')) return goPickDrink();

  // 点餐行：打开口味备注弹层
  const t = e.target.closest('[data-taste]');
  if (t) return openTasteModal(t.dataset.taste);

  // 菜单卡片：加入固定餐饮
  const add = e.target.closest('[data-add-dish]');
  if (add) {
    e.stopPropagation();
    return addDishToFixed(add.dataset.addDish);
  }
});

/**
 * 标签栏渲染。
 * 编辑态下：可删除的标签直接显示 ×，末尾出现「编辑 / ＋」；
 * 平时：末尾只有一个「编辑」入口。
 */
function renderCatBar(cats) {
  const editing = state.showCatEdit;
  const count = name => state.dishes.filter(d => d.category === name).length;

  const chips = cats.map(c => {
    // 「全部」不可删，但显示菜品总数
    if (c === '全部') {
      return `<button class="chip ${state.menuCat === '全部' ? 'active' : ''}" data-cat="全部" type="button">全部<span class="chip-num">${state.dishes.length}</span></button>`;
    }
    const cat = state.cats.find(x => x.name === c);
    const delBtn = editing
      ? `<span class="chip-x" data-cat-del="${cat ? cat.id : ''}" title="删除标签" role="button" tabindex="0">×</span>`
      : '';
    return `<span class="chip-wrap">
        <button class="chip ${state.menuCat === c ? 'active' : ''} ${editing ? 'chip-editing' : ''}" data-cat="${escapeHtml(c)}" type="button">
          ${escapeHtml(c)}<span class="chip-num">${count(c)}</span>
        </button>${delBtn}
      </span>`;
  }).join('');

  return chips + `<button class="chip chip-edit ${editing ? 'on' : ''}" id="edit-cats-btn" type="button">${editing ? '完成' : '编辑'}</button>`
    + (editing ? `<button class="chip chip-add" id="add-cat-btn" type="button" title="新增标签">＋</button>` : '');
}

/** 绑定标签栏交互：筛选 / 切编辑态 / 删除 / 新增 */
function bindCatBar(bar, cats) {
  bar.querySelectorAll('.chip[data-cat]').forEach(chip => {
    chip.addEventListener('click', () => {
      state.menuCat = chip.dataset.cat;
      // 换分类后回到第 1 页，否则可能停在一个已经不存在的页码上
      state.menuPage = 1;
      renderMenu();
    });
  });

  const editBtn = document.getElementById('edit-cats-btn');
  if (editBtn) editBtn.addEventListener('click', () => {
    state.showCatEdit = !state.showCatEdit;
    renderMenu();
  });

  // 删除：点 × 或键盘 Enter
  bar.querySelectorAll('[data-cat-del]').forEach(x => {
    if (!x.dataset.catDel) return;         // 菜品实际用到但无标签行的历史分类，不可删
    const fire = ev => { ev.stopPropagation(); removeCategory(x.dataset.catDel); };
    x.addEventListener('click', fire);
    x.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') fire(ev); });
  });

  const addBtn = document.getElementById('add-cat-btn');
  if (addBtn) addBtn.addEventListener('click', addCategory);
}


async function addCategory() {
  const name = (prompt('新标签名称（最多 8 个字）') || '').trim();
  if (!name) return;                      // 取消
  if (name.length > 8) return toast('标签名最多 8 个字');
  if (state.cats.some(c => c.name === name)) return toast('这个标签已经有了');
  const { error } = await cloud.database.from('dish_categories')
    .insert({ name, sort_order: state.cats.length + 1 }).select();
  if (error) return toast(error.message);
  toast(`已添加「${name}」`);
  await refresh();
}

async function removeCategory(id) {
  const cat = state.cats.find(c => String(c.id) === String(id));
  if (!cat) return;
  const n = state.dishes.filter(d => d.category === cat.name).length;
  const ok = await confirmAction({
    title: `删除标签「${cat.name}」？`,
    text: n
      ? `使用该标签的 ${n} 道菜会变为「未分类」，\n菜品本身不会被删除。`
      : '这个标签没有关联菜品，可以放心删除。',
    okText: '确认删除标签',
  });
  if (!ok) return;
  // 只移除标签行，菜品保留（category 置空后显示为「未分类」）
  if (!cat.builtin) {
    const { error } = await cloud.database.from('dish_categories').delete().eq('id', cat.id).select();
    if (error) return toast(error.message);
  }
  await cloud.database.from('dishes').update({ category: null }).eq('category', cat.name);
  state.cats = state.cats.filter(c => c.id !== cat.id);
  if (state.menuCat === cat.name) state.menuCat = '全部';
  toast(n ? `已删除标签，${n} 道菜变为未分类` : '标签已删除');
  await refresh();
}

function renderMenu() {
  // 标签顺序：自定义标签在前，菜品实际用到的分类补在后面（避免历史数据里的旧分类丢失）
  const cats = ['全部'];
  state.cats.forEach(c => { if (c.name && !cats.includes(c.name)) cats.push(c.name); });
  state.dishes.forEach(d => { if (d.category && !cats.includes(d.category)) cats.push(d.category); });
  if (state.menuCat !== '全部' && !cats.includes(state.menuCat)) state.menuCat = '全部';

  const bar = document.getElementById('menu-filters');
  // 标签集合或编辑态变化时重建，否则只切换选中态
  const sig = cats.join('|') + '#' + (state.showCatEdit ? '1' : '0');
  if (bar.dataset.cats !== sig) {
    bar.dataset.cats = sig;
    bar.innerHTML = renderCatBar(cats);
    bindCatBar(bar, cats);
  } else {
    bar.querySelectorAll('.chip').forEach(c =>
      c.classList.toggle('active', !c.classList.contains('chip-edit') && c.dataset.cat === state.menuCat));
  }

  renderCatOptions();

  const list = document.getElementById('menu-list');
  const items = state.menuCat === '全部'
    ? state.dishes

/** 菜单管理底部分页条：上一页 / 页码 / 下一页，并显示当前区间与总数 */
function renderPager(pager, page, pages, total, start, shown) {
  if (pages <= 1) { pager.classList.add('hidden'); pager.innerHTML = ''; return; }
  pager.classList.remove('hidden');

  const nums = [];
  // 页码窗口：页数不多（<=7）时全部列出，省得为 4 页还要点「…」
  // 页数多时只保留首尾页 + 当前页 ±1，中间用「…」连接
  if (pages <= 7) {
    for (let p = 1; p <= pages; p++) nums.push(p);
  } else {
    const push = p => { if (!nums.includes(p) && p >= 1 && p <= pages) nums.push(p); };
    push(1);
    for (let p = page - 1; p <= page + 1; p++) push(p);
    push(pages);
    nums.sort((a, b) => a - b);
  }

  let html = `<button class="pg-btn pg-edge" data-pg="${page - 1}" type="button"${page === 1 ? ' disabled' : ''} aria-label="上一页">‹</button>`;
  let prev = 0;
  nums.forEach(p => {
    if (prev && p - prev > 1) html += '<span class="pg-gap">…</span>';
    html += `<button class="pg-btn${p === page ? ' active' : ''}" data-pg="${p}" type="button"${p === page ? ' aria-current="page"' : ''}>${p}</button>`;
    prev = p;
  });
  html += `<button class="pg-btn pg-edge" data-pg="${page + 1}" type="button"${page === pages ? ' disabled' : ''} aria-label="下一页">›</button>`;

  pager.innerHTML = `
    <div class="pg-info">第 ${start + 1}-${start + shown} 道 · 共 ${total} 道</div>
    <div class="pg-nums">${html}</div>`;
}

/** 恢复一道菜到菜单 */
async function restoreOne(item) {
  // 不做同名去重：删掉一道「牛腩」又新加一道同名「牛腩」是常事，
  // 两者本就是不同的菜，按名字拦截会导致这道菜永远恢复不了。
  const { data, error } = await cloud.database.from('dishes').insert({
    name: item.name,
    category: item.category,
    image_data: item.image_data || null,
    ingredients: item.ingredients,
    note: item.note,
  }).select();
  if (error) return toast(error.message);

  const del = await cloud.database
    .from('trash_dishes').delete().eq('id', item.id).select();
  if (del.error) return toast(del.error.message);

  toast(`「${item.name}」已恢复到菜单`);
  await refresh();
}

document.getElementById('toggle-trash-btn').addEventListener('click', () => {
  state.showTrash = !state.showTrash;
  renderTrash();
});

document.getElementById('trash-list').addEventListener('click', async e => {
  const r = e.target.closest('[data-restore]');
  if (r) {
    const item = state.trash.find(t => String(t.id) === r.dataset.restore);
    if (item) await restoreOne(item);
    return;
  }
  const p = e.target.closest('[data-purge]');
  if (p) {
    const item = state.trash.find(t => String(t.id) === p.dataset.purge);
    if (!item) return;
    const ok = await confirmAction({
      title: '彻底删除这道菜？',
      text: `「${item.name}」将被永久移除，\n删掉后无法再恢复。`,
      okText: '彻底删除',
    });
    if (!ok) return;
    const { error } = await cloud.database
      .from('trash_dishes').delete().eq('id', item.id).select();
    if (error) return toast(error.message);
    state.trash = state.trash.filter(t => t.id !== item.id);
    toast('已彻底删除，无法恢复');
    renderTrash();
  }
});

// 全部恢复：逐条恢复，兼容同名已存在的情况
document.getElementById('restore-all-btn').addEventListener('click', async () => {
  const items = state.trash.slice();
  if (!items.length) return toast('删除历史是空的');
  let ok = 0;
  let failed = 0;
  for (const item of items) {
    const { error } = await cloud.database.from('dishes').insert({
      name: item.name,
      category: item.category,
      image_data: item.image_data || null,
      ingredients: item.ingredients,
      note: item.note,
    }).select();
    if (error) { failed++; continue; }
    await cloud.database.from('trash_dishes').delete().eq('id', item.id);
    ok++;
  }
  toast(failed ? `已恢复 ${ok} 道，${failed} 道失败` : `已恢复 ${ok} 道菜`);
  await refresh();
});

// 卡片点击进编辑；删除按钮独立处理并阻止冒泡，避免误开编辑弹层
document.getElementById('menu-list').addEventListener('click', async e => {
  // 「加入」按钮：阻止冒泡，避免连带触发卡片编辑
  if (e.target.closest('[data-add-dish]')) return;

  const del = e.target.closest('[data-del-dish]');
  if (del) {
    e.stopPropagation();
    const dish = state.dishes.find(d => d.id === Number(del.dataset.delDish));
    if (!dish) return;
    const ok = await confirmAction({
      title: '删除这道菜？',
      text: `「${dish.name}」会移入「删除历史」。\n之后可以从删除历史里恢复。`,
      okText: '确认删除',
    });
    if (!ok) return;
    const res = await moveToTrash(dish);
    if (res.error) return toast(res.error.message);
    if (res.notFound) return toast('这道菜可能已被删除');
    state.dishes = state.dishes.filter(d => d.id !== dish.id);
    state.trash.unshift(res.record);
    toast(`「${dish.name}」已移入删除历史，可恢复`);
    render();
    return;
  }

  const card = e.target.closest('[data-edit]');
  if (card) openDishModal(state.dishes.find(d => d.id === Number(card.dataset.edit)));
});

// ---- 分类下拉 ----
/**
 * 分类可选项 = 自定义标签(dish_categories) + 菜品实际用到的分类 + 预置兜底。
 * 三者取并集去重：历史数据里的旧分类、或手动改过名字的分类都不会丢。
 */
function allCatOptions() {
  const opts = [];
  const push = (name, kind) => {
    name = (name || '').trim();
    if (!name) return;
    const hit = opts.find(o => o.name === name);
    if (hit) { if (kind !== 'custom') hit.kind = hit.kind || kind; return; }
    opts.push({ name, kind });
  };
  state.cats.forEach(c => push(c.name, 'custom'));
  state.dishes.forEach(d => push(d.category, 'used'));
  DEFAULT_CATEGORIES.forEach(n => push(n, 'default'));
  return opts;
}

const catPanel = document.getElementById('cat-panel');
const catInput = document.getElementById('dish-cat');
const catSelect = document.getElementById('cat-select');
const catCaret = document.getElementById('cat-caret');
let catCursor = -1;

const CAT_KIND_LABEL = { custom: '自定义', used: '已有菜品', default: '预置' };

/** 渲染下拉面板；filter 为空时列出全部标签 */
function renderCatOptions(filter) {
  const q = (filter || '').trim();
  const all = allCatOptions();
  const cur = catInput.value.trim();
  const list = q ? all.filter(o => o.name.includes(q)) : all;

  catCursor = -1;
  if (!list.length) {
    catPanel.innerHTML = `<p class="cat-panel-empty">${
      q ? `没有匹配「${escapeHtml(q)}」的标签<br>直接保存就会新建这个标签`
        : '还没有任何标签，直接输入就能新建'
    }</p>`;
    return;
  }

  catPanel.innerHTML = list.map(o => `
    <button class="cat-opt${o.name === cur ? ' is-current' : ''}" data-cat-opt="${escapeHtml(o.name)}" type="button" role="option">
      <span class="cat-opt-name">${escapeHtml(o.name)}</span>
      <span class="cat-opt-tag">${CAT_KIND_LABEL[o.kind] || '标签'}</span>
      <span class="cat-opt-n">${state.dishes.filter(d => d.category === o.name).length} 道</span>
    </button>`).join('');
}

function openCatPanel() {
  catSelect.classList.add('open');
  catPanel.classList.remove('hidden');
  catCaret.setAttribute('aria-expanded', 'true');
  renderCatOptions('');
  catPanel.scrollTop = 0;
}

function closeCatPanel() {
  catSelect.classList.remove('open');
  catPanel.classList.add('hidden');
  catCaret.setAttribute('aria-expanded', 'false');
  catCursor = -1;
}

function catPanelOpen() { return !catPanel.classList.contains('hidden'); }

/** 选中一个标签：填进输入框并关闭面板 */
function pickCat(name) {
  catInput.value = name;
  closeCatPanel();
  catInput.dispatchEvent(new Event('input', { bubbles: true }));
  catInput.focus();
}

catCaret.addEventListener('click', e => {
  e.stopPropagation();
  if (catPanelOpen()) closeCatPanel();
  else { openCatPanel(); catInput.focus(); }
});

// 点输入框：空值时展开全部；有值且完全匹配时不打扰（避免遮挡输入法）
catInput.addEventListener('focus', () => { if (!catPanelOpen() && !catInput.value.trim()) openCatPanel(); });
catInput.addEventListener('click', e => e.stopPropagation());

// 输入时实时过滤，保留手动输入新标签的能力
catInput.addEventListener('input', () => {
  if (!catPanelOpen()) openCatPanel();
  renderCatOptions(catInput.value);
});

catInput.addEventListener('keydown', e => {
  const opts = [...catPanel.querySelectorAll('[data-cat-opt]')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!catPanelOpen()) { openCatPanel(); return; }
    e.preventDefault();
    if (!opts.length) return;
    catCursor = e.key === 'ArrowDown'
      ? (catCursor + 1) % opts.length
      : (catCursor - 1 + opts.length) % opts.length;
    opts.forEach((o, i) => o.classList.toggle('active', i === catCursor));
    opts[catCursor].scrollIntoView({ block: 'nearest' });
    return;
  }
  if (e.key === 'Enter') {
    // 有高亮项就选它，否则把输入内容当新标签
    if (catPanelOpen() && opts.length) {
      e.preventDefault();
      pickCat(opts[Math.max(catCursor, 0)].dataset.catOpt);
    }
    return;
  }
  if (e.key === 'Escape') {
    if (catPanelOpen()) { e.stopPropagation(); closeCatPanel(); }
  }
});

// 面板内的点选用事件委托，重渲染后无需重新绑定
catPanel.addEventListener('mousedown', e => e.preventDefault()); // 防止输入框失焦
catPanel.addEventListener('click', e => {
  const opt = e.target.closest('[data-cat-opt]');
  if (opt) pickCat(opt.dataset.catOpt);
});

document.addEventListener('click', e => {
  if (catPanelOpen() && !catSelect.contains(e.target)) closeCatPanel();
});

// ---- 菜品弹层 ----
const dishModal = document.getElementById('dish-modal');
let editingDish = null;
let pendingPhoto = null;

document.getElementById('add-dish-btn').addEventListener('click', () => openDishModal(null));

function openDishModal(dish) {
  editingDish = dish || null;
  pendingPhoto = dish ? (dish.image_data || null) : null;

  document.getElementById('dish-modal-title').textContent = dish ? '编辑菜品' : '添加菜品';
  document.getElementById('dish-name').value = dish ? dish.name : '';
  document.getElementById('dish-cat').value = dish ? (dish.category || '') : '';
  document.getElementById('dish-ing').value = dish ? (dish.ingredients || '') : '';
  document.getElementById('dish-note').value = dish ? (dish.note || '') : '';
  document.getElementById('dish-delete').classList.toggle('hidden', !dish);

  setSaveState('修改会自动保存');
  updatePhotoBox();
  closeCatPanel();
  renderCatOptions('');   // 预渲染，打开时零延迟
  dishModal.classList.remove('hidden');
  setTimeout(() => document.getElementById('dish-name').focus(), 60);
}

function updatePhotoBox() {
  const box = document.getElementById('photo-box');
  const name = document.getElementById('dish-name').value.trim() || '新菜品';
  box.innerHTML = pendingPhoto
    ? `<img src="${pendingPhoto}" alt="">`
    : `<img src="${placeholderImage(name, 'menu')}" alt="">`;
}

document.getElementById('dish-name').addEventListener('input', updatePhotoBox);

document.getElementById('photo-choose').addEventListener('click', () =>
  document.getElementById('photo-input').click());

// ---- 实时保存：输入停顿后自动写入 ----
let saveTimer = null;
const saveState = document.getElementById('dish-save-state');

function setSaveState(text, tone) {
  if (!saveState) return;
  saveState.textContent = text;
  saveState.className = 'save-state' + (tone ? ' ' + tone : '');
}

function collectDish() {
  const name = document.getElementById('dish-name').value.trim();
  const cat = document.getElementById('dish-cat').value.trim();
  return {
    name: name || '未命名菜品',
    // 不填分类就留空（菜单里显示为「未分类」）。
    // 早先这里兜底成「家常菜」，会造出一个标签表里并不存在的幽灵分类。
    category: cat || null,
    ingredients: document.getElementById('dish-ing').value.trim(),
    note: document.getElementById('dish-note').value.trim(),
    image_data: pendingPhoto,
    updated_at: new Date().toISOString(),
  };
}

/** 新菜品首次输入时立刻建档，之后走更新 */
async function persistDish() {
  const payload = collectDish();

  if (!editingDish) {
    const { data, error } = await cloud.database
      .from('dishes').insert(payload).select();
    if (error) {
      setSaveState('保存失败：' + error.message, 'err');
      toast(error.message || '保存失败');
      return;
    }
    if (data && data.length) {
      editingDish = data[0];
      state.dishes.unshift(data[0]);
      renderMenu();
      renderHome();
    }
    setSaveState('已保存', 'ok');
    return;
  }

  const { data, error } = await cloud.database
    .from('dishes').update(payload).eq('id', editingDish.id).select();
  if (error) {
    setSaveState('保存失败：' + error.message, 'err');
    toast(error.message || '保存失败');
    return;
  }
  if (data && data.length) {
    const i = state.dishes.findIndex(d => d.id === editingDish.id);
    if (i >= 0) state.dishes[i] = data[0];
    renderMenu();
    renderHome();
  }
  setSaveState('已保存', 'ok');
}

function scheduleSave() {
  setSaveState('保存中…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistDish, 700);
}

['dish-name', 'dish-cat', 'dish-ing', 'dish-note'].forEach(id => {
  document.getElementById(id).addEventListener('input', scheduleSave);
});

document.getElementById('photo-input').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    setSaveState('照片处理中…');
    pendingPhoto = await compressImage(file);
    updatePhotoBox();
    await persistDish();
  } catch (err) {
    setSaveState('保存失败', 'err');
    toast(err.message || '照片处理失败');
  }
  e.target.value = '';
});

document.getElementById('photo-clear').addEventListener('click', () => {
  pendingPhoto = null;
  updatePhotoBox();
  persistDish();
});

document.getElementById('dish-delete').addEventListener('click', async () => {
  if (!editingDish) return;
  const name = editingDish.name;
  const ok = await confirmAction({
    title: '删除这道菜？',
    text: `「${name}」会移入「删除历史」。\n之后可以从删除历史里恢复。`,
    okText: '确认删除',
  });
  if (!ok) return;
  clearTimeout(saveTimer);
  const res = await moveToTrash(editingDish);
  if (res.error) return toast(res.error.message);
  if (res.notFound) return toast('这道菜可能已被删除');
  state.dishes = state.dishes.filter(d => d.id !== editingDish.id);
  state.trash.unshift(res.record);
  dishModal.classList.add('hidden');
  toast('已移入删除历史，可恢复');
  editingDish = null;
  render();
});

// =========================================================
// 身份
// =========================================================

const meModal = document.getElementById('me-modal');
document.getElementById('who-btn').addEventListener('click', () => {
  document.getElementById('me-name').value = state.name;
  document.getElementById('me-title').textContent = '你的名字';
  document.getElementById('me-tip').textContent =
    '名字只保存在这台设备上，用来标记是谁点的菜，朋友那边会看到。';
  meModal.classList.remove('hidden');
});

document.getElementById('me-save').addEventListener('click', () => {
  const n = document.getElementById('me-name').value.trim();
  localStorage.setItem('hd_name', n);
  state.name = n;
  meModal.classList.add('hidden');
  toast('已保存');
  render();
});

/** 关闭弹层前先落盘，避免待保存的修改丢失 */
function closeModal(modal) {
  if (modal && modal.id === 'dish-modal') persistDish();
  modal.classList.add('hidden');
}

// 关闭弹层
document.querySelectorAll('[data-close]').forEach(el => {
  el.addEventListener('click', () => closeModal(el.closest('.modal')));
});
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) closeModal(m); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    // 分类下拉优先收起：否则第一次 Esc 会连带把整个菜品弹层关掉
    if (catPanelOpen()) {
      e.stopPropagation();
      closeCatPanel();
      catInput.focus();
      return;
    }
    document.querySelectorAll('.modal:not(.hidden)').forEach(m => closeModal(m));
  }
});

// =========================================================
// 主渲染与启动
// =========================================================

function render() {
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  document.getElementById('view-' + state.view).classList.remove('hidden');
  // 「固定餐饮」是点餐的二级页：进入它时底部仍高亮「点餐」，避免出现无高亮项
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active',
      t.dataset.go === state.view || (state.view === 'fixed' && t.dataset.go === 'order')));
  document.getElementById('who-btn').textContent = initials();

  renderHome();
  renderFixedEntry();

  if (state.view === 'order') {
    // 饮品视图与早/午/晚互斥：进页面时按 state.showDrink 恢复正确的高亮
    document.querySelectorAll('.slot-tab').forEach(b =>
      b.classList.toggle('active', !state.showDrink && b.dataset.slot === state.slot));
    syncDrinkBtn();
    document.getElementById('date-picker').value = state.date;
    renderOrderList();
  }
  if (state.view === 'menu') { renderMenu(); renderTrash(); }
  if (state.view === 'fixed') renderFixed();
}

/**
 * 点餐页顶部「固定餐饮」入口右侧的摘要文字。
 * 现在固定餐饮是菜品库，摘要改为「共N 道菜 · 已加当天 M 道」。
 */
function renderFixedEntry() {
  const el = document.getElementById('fixed-entry-count');
  if (!el) return;
  if (!state.dishes.length) {
    el.textContent = '菜单暂无菜';
    return;
  }
  const total = state.dishes.length;
  const added = state.orders.filter(o => o.order_date === state.date).length;
  el.textContent = added ? `共 ${total} 道菜 · 当日已加 ${added} 道` : `共 ${total} 道菜`;
}

/**
 * 数据不可用时的说明页。
 * 常见原因：当前域名未被云服务授权（换了访问域名就会出现）。
 */
function showDataError(err) {
  const msg = (err && (err.message || err.error_description)) || '未知错误';
  const denied = /origin|denied|not allowed|42501|permission/i.test(String(msg));
  document.getElementById('view-home').innerHTML =
    '<div class="card" style="margin-top:8px">' +
    '<div class="card-head"><h3>数据暂时连不上</h3></div>' +
    '<p class="field-tip" style="margin:0 0 12px;line-height:1.7">' +
    (denied
      ? '当前访问域名（<code>' + location.host + '</code>）还没有被数据服务授权，所以读不到内容。'
      : '错误信息：' + escapeHtml(String(msg))
    ) +
    '</p></div>';
  document.getElementById('view-home').classList.remove('hidden');
}

async function boot() {
  // 免登录：直接读取共享数据
  try {
    await loadAll();
  } catch (e) {
    showDataError(e);
  }
  render();

  // 未设置名字时，主动引导一次，仅本机保存
  if (!state.name) {
    setTimeout(() => {
      document.getElementById('me-title').textContent = '先给自己起个名字';
      document.getElementById('me-tip').textContent =
        '不用登录，名字只存在这台设备上，用来标记哪道菜是谁想吃的。';
      const m = document.getElementById('me-modal');
      m.classList.remove('hidden');
      setTimeout(() => document.getElementById('me-name').focus(), 60);
    }, 400);
  }
}

boot();
</script>
