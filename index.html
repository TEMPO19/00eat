<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>凌雪食堂</title>
<style>
:root {
  /* 暖色调：陶土橘 + 奶油米底 */
  --ink: #3A2A21;
  --ink-soft: #6B5347;
  --ink-mute: #A08D80;
  --line: #EFE2D6;
  --line-soft: #F7EFE7;
  --bg: #FDF8F3;
  --card: #FFFFFF;
  --brand: #D2694A;
  --brand-deep: #B8543A;
  --brand-soft: #F6DCCC;
  --brand-wash: #FDF0E7;
  --accent: #E9A23B;
  --danger: #C0503F;
  --radius: 16px;
  --radius-sm: 11px;
  --shadow: 0 1px 2px rgba(90, 58, 42, .05), 0 8px 24px rgba(90, 58, 42, .06);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Helvetica Neue", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

body { min-height: 100vh; }
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }

/* ---------- 手机适配 ---------- */

/* iOS Safari：可聚焦的表单控件字号 < 16px 会自动放大整个页面，
   因此仅对输入类控件提升到 16px；按钮和文本不受影响 */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  min-height: 100dvh;
  /* 禁止横向抖动，同时保留纵向滚动 */
  overflow-x: hidden;
}

input, textarea, select { font-size: 16px; font-family: inherit; }
button { font-family: inherit; }

/* 触摸目标不小于 40px，手指更容易点中 */
.btn-primary, .btn-ghost, .btn-danger { min-height: 42px; }
.btn-sm { min-height: 40px; padding-top: 10px; padding-bottom: 10px; }
.order-del, .card-del, .mini-del { min-width: 40px; min-height: 40px; }
.slot-tab, .sub-tab, .tab { touch-action: manipulation; }
.menu-card, .trash-item { touch-action: manipulation; }

/* 底部导航同时适配home indicator 安全区 */
.tabbar { padding-bottom: max(var(--safe-b), 6px); }

/* 弹层内部可滚动，避免小屏被键盘顶飞（具体见下方 .modal-body） */

/* 去除 iOS 横竖屏切换时的尺寸跳变 */
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}

/* ---------- 通用控件 ---------- */
.seg {
  display: flex;
  background: var(--brand-wash);
  border-radius: 12px;
  padding: 3px;
  margin-bottom: 18px;
}
.seg-wide { width: 100%; }
.seg-btn {
  flex: 1;
  padding: 9px 8px;
  border-radius: 9px;
  font-size: 14px;
  color: var(--ink-soft);
  transition: all .18s;
}
.seg-btn.active {
  background: var(--card);
  color: var(--brand-deep);
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(90, 58, 42, .09);
}

.field { display: block; }
.field > span {
  display: block;
  margin-bottom: 7px;
  font-size: 12.5px;
  color: var(--ink-soft);
  font-weight: 550;
}
.field input[type="text"],
.field input[type="email"],
.field input[type="password"],
.field input[type="date"] {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
  /* 16px：iOS 聚焦输入框时不再自动放大页面 */
  font-size: 16px;
  outline: none;
  transition: border-color .18s, background .18s;
}
.field textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;   /* iOS 聚焦不放大 */
  line-height: 1.6;
  resize: vertical;
  min-height: 76px;
  outline: none;
  transition: border-color .18s, background .18s;
}
.field textarea:focus { border-color: var(--brand); background: var(--card); }
.field input:focus {
  border-color: var(--brand);
  background: var(--card);
}
.field-tip { margin: 8px 0 0; font-size: 12px; color: var(--ink-mute); line-height: 1.5; }

/* ---------- 分类下拉：自绘面板，替代 <datalist> ----------
   <datalist> 在 iOS Safari / 微信内置浏览器里基本不会弹出原生列表，
   所以改成受控的 input + 展开面板，行为在所有移动端一致。 */
.cat-select { position: relative; }
.cat-select input[type="text"] { padding-right: 40px; }
.cat-select.open input[type="text"] {
  border-color: var(--brand);
  background: var(--card);
}
.cat-caret {
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  /* 触控目标不小于 36px，展开热区覆盖整个输入框右侧 */
  width: 36px;
  height: 36px;
  border-radius: 10px;
  color: var(--ink-mute);
  transition: background .16s, color .16s, transform .18s;
}
.cat-caret:hover { background: var(--line-soft); color: var(--ink-soft); }
.cat-caret:active { background: var(--line); }
.cat-select.open .cat-caret {
  color: var(--brand-deep);
  transform: translateY(-50%) rotate(180deg);
}

.cat-panel {
  position: absolute;
  z-index: 40;
  left: 0;
  right: 0;
  top: calc(100% + 6px);
  max-height: 232px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--card);
  box-shadow: 0 10px 28px rgba(90, 58, 42, .18);
}
.cat-opt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  min-height: 42px;
  padding: 10px 12px;
  border-radius: 9px;
  background: transparent;
  color: var(--ink);
  font-size: 15px;
  text-align: left;
  transition: background .14s;
}
.cat-opt:hover, .cat-opt.active { background: var(--brand-wash); }
.cat-opt-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-opt-n {
  flex-shrink: 0;
  font-size: 11.5px;
  color: var(--ink-mute);
}
.cat-opt.is-current .cat-opt-name { color: var(--brand-deep); font-weight: 600; }
.cat-opt.is-current .cat-opt-n { color: var(--brand-deep); }
/* 面板里展示的标签来源：自定义标签 / 菜品实际用到的分类 / 系统预置 */
.cat-opt-tag {
  flex-shrink: 0;
  padding: 1px 6px;
  border-radius: 6px;
  background: var(--line-soft);
  color: var(--ink-mute);
  font-size: 10.5px;
}
.cat-panel-empty {
  padding: 14px 12px;
  font-size: 12.5px;
  color: var(--ink-mute);
  line-height: 1.6;
}

.field-row { display: flex; gap: 9px; }
.field-row input { flex: 1; }

.btn-primary {
  padding: 12px 18px;
  border-radius: var(--radius-sm);
  background: var(--brand);
  color: #fff;
  font-size: 15px;
  font-weight: 550;
  transition: background .18s, transform .1s;
}
.btn-primary:hover { background: var(--brand-deep); }
.btn-primary:active { transform: scale(.985); }
.btn-primary:disabled { opacity: .55; cursor: not-allowed; }
.btn-sm { padding: 9px 15px; font-size: 13.5px; }

.btn-ghost {
  padding: 11px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
  font-size: 14px;
  transition: border-color .18s, color .18s;
}
.btn-ghost:hover { border-color: var(--brand); color: var(--brand-deep); }

.btn-link { padding: 2px 0; font-size: 13px; color: var(--brand); }
.btn-link:hover { color: var(--brand-deep); }
/* 无二次确认，破坏性操作按钮用红色标示 */
.btn-link-warn { color: var(--danger); }
.btn-link-warn:hover { color: #A8442F; }

.btn-danger {
  padding: 11px 16px;
  border-radius: var(--radius-sm);
  background: #FBF1EF;
  color: var(--danger);
  font-size: 14px;
}

.btn-icon {
  width: 34px; height: 34px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: var(--ink-soft);
  background: var(--brand-wash);
}
.btn-icon:hover { background: var(--brand-soft); }

/* ---------- 顶栏 ---------- */
.app { max-width: 620px; margin: 0 auto; min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(253, 248, 243, .93);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line-soft);
}
.topbar-inner {
  max-width: 620px; margin: 0 auto;
  padding: 14px 20px;
  /* 刘海屏 /灵动岛机型：留出状态栏与浏览器工具区高度 */
  padding-top: calc(14px + env(safe-area-inset-top));
  display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(234, 166, 75, .18);
}
.brand-name { font-size: 16px; font-weight: 650; letter-spacing: .5px; }
/* 顶栏涂鸦：凌雪的笑脸。原图宽高比 1.64，按高度定尺寸避免压到文字 */
.brand-mascot {
  width: auto;
  height: 30px;
  margin-left: 1px;
  object-fit: contain;
  object-position: center bottom;
  filter: saturate(1.05);
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
.avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  font-size: 13px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}

.main { padding: 20px 20px 118px; }

/* ---------- 视图 ---------- */
.view { animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.page-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  /* 标题行上下都留呼吸空间：下方紧跟的是「加菜」入口和左侧餐次栏，
     留太窄会显得三层内容黏在一起 */
  margin: 2px 0 18px;
}
/* 页面主标题：与卡片标题同一套视觉语言（品牌色渐变竖条 + 加粗字重 + 轻微字距），
   但尺度更大一档 —— 页面级标题要压得住下面的内容块。
   用 flex 是为了让竖条与文字自动垂直居中，不必手算 line-height。 */
.page-head h2 {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .5px;
  color: var(--ink);
  line-height: 1.3;
}
.page-head h2::before {
  content: "";
  flex: 0 0 auto;
  width: 5px;
  height: 19px;
  border-radius: 3px;
  background: linear-gradient(180deg, var(--brand) 0%, var(--accent) 100%);
}

/* ---------- 首页 ---------- */
.hero {
  position: relative;
  overflow: hidden;
  padding: 24px 22px;
  border-radius: 20px;
  background: linear-gradient(140deg, #E0855C 0%, #D2694A 48%, #C05A3E 100%);
  color: #fff;
  margin-bottom: 16px;
  box-shadow: 0 6px 20px rgba(200, 96, 62, .22);
}
.hero::before {
  content: '';
  position: absolute;
  top: -30px; right: -20px;
  width: 150px; height: 150px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .09);
}
.hero-body {
  position: relative;
  z-index: 1;
  padding-right: 122px;   /* 为猫咪形象留出空间 */
}
.hero-date { margin: 0 0 6px; font-size: 12.5px; opacity: .85; letter-spacing: .3px; }
.hero-title { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.4; }
.hero-sub { margin: 8px 0 0; font-size: 13px; opacity: .88; line-height: 1.5; }

/* 猫咪形象 */
.hero-mascot {
  position: absolute;
  z-index: 1;
  right: -10px;
  bottom: -18px;
  width: 128px;
  height: auto;
  filter: drop-shadow(0 4px 10px rgba(90, 40, 20, .22));
  pointer-events: none;
  user-select: none;
}

.stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
/* 三列网格：文字在左、数字真正居中、图标在右。
   数字是卡片的视觉重心，所以给它独立的一列居中放，而不是跟在文字后面。 */
.stat {
  flex: 1;
  min-width: 0;
  /* 上下两行：标签独占一行，数字与图标在第二行。
     之前是「标签 | 数字 | 图标」三列横排，标签放大后 4 个字
     在 ~90px 的左列里放不下，被迫折成「菜单菜/品」两行，
     数字也被挤歪、卡片高度还不齐。改成两行后标签有整卡宽度可用。 */
  display: grid;
  grid-template-rows: auto auto;
  align-items: center;
  justify-items: start;
  row-gap: 6px;
  padding: 16px 14px;
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow);
  text-align: left;
  transition: transform .14s;
}
.stat:active { transform: scale(.975); }
/* 第二行：数字在左、图标在右 */
.stat-bottom {
  grid-row: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
}
/* 数字：放大后作为整张卡片的视觉焦点 */
.stat-num {
  font-size: 40px;
  font-weight: 700;
  color: var(--brand);
  line-height: 1;
  letter-spacing: -.5px;
  font-variant-numeric: tabular-nums;
}
.stat-label {
  grid-row: 1;
  min-width: 0;
  max-width: 100%;
  font-size: 16px;
  font-weight: 600;
  /* 颜色从 --ink-mute 提到 --ink-soft：字重加粗后原来的浅灰会显脏 */
  color: var(--ink-soft);
  /* 标签独占一行、可用宽度充足，保持单行不折行 */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}
/* 右侧手绘小图标：只定 height、width:auto 保持原图比例。
   不要加 max-width —— 宽图（如 ratio 1.38）会被压扁，实测渲染比 1.182 ≠ 原图 1.378 */
.stat-icon {
  flex: 0 0 auto;
  align-self: center;
  display: block;
  width: auto;
  height: 40px;
  object-fit: contain;
  object-position: right center;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
/* 卡片标题：字号加大 + 字重加粗 + 轻微字距，前面加一段品牌色短竖条做视觉锚点。
   比原来 15px/600 更「有标题感」，又不会抢走内容的注意力。 */
.card-head h3 {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .4px;
  color: var(--ink);
  line-height: 1.3;
}
.card-head h3::before {
  content: "";
  flex: 0 0 auto;
  width: 4px;
  height: 15px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--brand) 0%, var(--accent) 100%);
}

/* ---------- 灵感咕卡片背景水印 ----------
   炒饭图原本是标题旁 34px 的小挂图，缩到这个尺寸后画里细节全糊了（用户反馈"看不清"）。
   改成整卡背景：铺满、低透明度、内容浮在图上。
   用 ::before 而不是给 <img> 定位 —— 伪元素不会参与布局，不会挤动输入框和列表。 */
.card-wish {
  position: relative;
  overflow: hidden;   /* 图铺出圆角时裁掉，别让方角戳出卡片 */
  isolation: isolate;  /* 建立层叠上下文，让水印 z-index:0 不会盖到别处 */
}

  /* 固定 190px 宽，不随卡片高度缩放。
     这里不能用 cover：素材是 604×226（比例 2.67），卡片约 358×208（比例 1.72），
     比例对不上时 cover 为了铺满高度得把图放大到 550px 宽 ——
     记录一多卡片变高，cover 的缩放比跟着变，背景就一路放大。
     固定像素宽才是「图多大就是多大」。

     右边距 76px 而不是贴卡片边缘：实测「记下」按钮占 x=283~340，
     图原来 252px 宽铺在 92~344，整张都躲在按钮底下。
     缩到 190px 并右移后右缘停在 275px，正好在按钮左侧留出间距。 */
  background-size: 190px auto;
  /* 垂直用 top 锚定而不是 center：center 会让图中心跟着卡片中心走，
     卡片长高时整张图缓慢下移，看起来像在「动」。
     top 62px 让位置绝对固定，只有卡片内容在它下面增长。 */
  /* 原图是彩色的，白底上 0.07 几乎看不见（实测截图确认）——
     0.14 是「看得见图案」与「不干扰正文」的平衡点 */
  opacity: .14;
  pointer-events: none;  /* 水印绝不能挡住输入和点击 */
  z-index: 0;
}
/* 内容层浮到水印之上。给直接子元素统一上移，比逐个改稳妥 */
.card-wish > * { position: relative; z-index: 1; }

/* 标题里的「清空」按钮：灵感咕标题旁不再有装饰图，
   用 margin-left:auto 把「清空」推到最右，与其他卡片标题一致 */
.card-wish .card-head h3 { margin-right: auto; }

.quick-add { display: flex; gap: 8px; margin-bottom: 12px; }
.quick-add input {
  flex: 1;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  /* 输入框本身不填充：整卡背景（炒饭水印）要能透出来，
     只留一圈边框提示这里是可输入区域 */
  background: transparent;
  font-size: 16px;   /* iOS 聚焦不放大 */
  outline: none;
}
/* 聚焦时给一点白底：背景图局部可能偏深，不垫底看不见光标 */
.quick-add input:focus { border-color: var(--brand); background: rgba(255,255,255,.72); }
.quick-add input::placeholder { color: var(--ink-mute); opacity: .8; }

.mini-list { display: flex; flex-direction: column; gap: 9px; }
.mini-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  font-size: 13.5px;
}
/* 灵感咕的条目：半透明白，和输入框一样让卡片背景透出来。
   .card-wish > * 已把 z-index 提到 1，这里只调颜色不改层叠。 */
.card-wish .mini-item { background: rgba(255,255,255,.72); }
.card-wish .mini-item:hover { background: rgba(255,255,255,.86); }
.mini-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-item .m { font-size: 11.5px; color: var(--ink-mute); flex-shrink: 0; }

.mini-del:active { opacity: 1; background: #F5DCD5; }

/* ---------- 点餐 ---------- */
/* 日期切换：‹ 日期 › 三个控件合成一个胶囊，整体像「一个东西」而不是三块散件 */
.date-nav {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  box-shadow: 0 1px 2px rgba(90, 58, 42, .04);
}
.date-nav .btn-icon {
  width: 32px;
  height: 32px;
  min-height: 32px;
  border-radius: 9px;
  background: var(--brand-wash);
  color: var(--brand-deep);
  font-size: 17px;
  line-height: 1;
}
.date-nav .btn-icon:hover { background: var(--brand-soft); }
.date-nav input {
  /* 去掉控件自身的边框和底色 —— 外层胶囊已经提供了边框，
     再叠一层会出现「框中框」，这是原来看着散的原因 */
  border: none;
  background: transparent;
  padding: 4px 6px;
  min-height: 32px;
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  outline: none;
}
/* 聚焦时给一层浅底提示，但不再画边框 */
.date-nav input:focus { background: var(--brand-wash); }

/* 左侧餐次栏 + 右侧内容区 */
.order-layout {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.order-main {
  flex: 1;
  min-width: 0;
}

/* 竖排餐次栏：浅灰底，选中项为白底圆角胶囊。
   宽度刻意压到 56px——右侧内容区要留给「菜名 + 口味备注」同行显示。 */
.slot-rail {
  flex-shrink: 0;
  width: 56px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 5px 3px;
  border-radius: 14px;
  background: #F2ECE7;
  position: sticky;
  top: 76px;
}
.slot-tab {
  display: block;
  width: 100%;
  padding: 11px 1px;
  border-radius: 10px;
  background: transparent;
  color: var(--ink-mute);
  font-size: 13px;
  text-align: center;
  transition: background .18s, color .18s;
}
.slot-tab:hover { color: var(--ink-soft); }
.slot-tab.active {
  background: var(--card);
  color: var(--brand-deep);
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(90, 58, 42, .12);
}

/* 左侧栏底部的「饮品」：与早/午/晚互斥，不占用餐次 */
.slot-drink {
  display: block;
  width: 100%;
  min-height: 40px;
  margin-top: 4px;
  padding: 10px 1px;
  border-top: 1px solid rgba(90, 58, 42, .08);
  border-radius: 10px;
  background: transparent;
  color: var(--ink-mute);
  font-size: 13px;
  text-align: center;
  transition: background .18s, color .18s;
}
.slot-drink:hover { color: var(--ink-soft); }
.slot-drink.active {
  background: var(--card);
  color: var(--brand-deep);
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(90, 58, 42, .12);
}

/* 菜名与口味备注同一行：菜名可压缩截断，备注跟在右侧。
   容器不换行——两段都在一行内分配空间，菜名保底 3.6em（约 4 个字），
   口味标签先被压缩并用省略号收尾，不会把菜名挤成竖排。 */
.order-name-row {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}
/* 饮品行：口味较长，菜名与口味顶部对齐，口味块内部可换行到两行 */
.order-name-row.drink-row {
  align-items: flex-start;
}
.order-name-row.drink-row .order-name {
  padding-top: 3px;
}

/* 点餐行里的口味备注：紧跟菜名右侧，空间不足时压缩并省略 */
.order-taste {
  flex: 0 1 auto;
  min-width: 0;
  max-width: 78px;
  min-height: 24px;
  padding: 3px 9px;
  border-radius: 12px;
  background: var(--line-soft);
  color: var(--ink-mute);
  font-size: 11px;
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: background .18s, color .18s;
}
.order-taste.has {
  background: var(--brand-wash);
  color: var(--brand-deep);
  font-weight: 600;
}
/* 饮品口味维度多（甜度+浓度+冰量），给宽一点并允许两行，别把菜名挤没 */
.drink-taste {
  max-width: 100%;
  min-height: 22px;
  font-size: 10.5px;
  line-height: 1.35;
  padding: 2px 8px;
  text-align: left;
  white-space: normal;
  word-break: break-word;
}

/* 口味备注弹层 */
.taste-dish {
  margin: -6px 0 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
}
.taste-quick {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.taste-chip {
  min-height: 36px;
  padding: 7px 13px;
  border-radius: 18px;
  background: var(--line-soft);
  color: var(--ink-soft);
  font-size: 13px;
  transition: background .18s, color .18s;
}
.taste-chip.active {
  background: var(--brand);
  color: #fff;
  font-weight: 600;
}
/* 饮品口味：按甜度/浓度/冰量/其他分组，同组互斥 */
.taste-group {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
}
.taste-group + .taste-group { margin-top: 4px; }
.taste-group-name {
  flex: 0 0 34px;
  padding-top: 8px;
  font-size: 12px;
  color: var(--ink-mute);
  text-align: right;
}
.taste-group-items {
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-width: 0;
}
.taste-foot { justify-content: space-between; }
.taste-foot .btn-ghost { min-height: 44px; padding: 11px 18px; }
.taste-foot .btn-primary { min-height: 44px; padding: 11px 22px; }

.order-list { display: flex; flex-direction: column; gap: 10px; }

/* 饮品视图底部的「添加饮品」：虚线框，呼应"随手加"的轻量感 */
.drink-add {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  min-height: 48px;
  padding: 12px;
  border: 1.5px dashed var(--line);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink-soft);
  font-size: 14px;
  transition: border-color .18s, color .18s, background .18s;
}
.drink-add:hover {
  border-color: var(--brand);
  color: var(--brand-deep);
  background: var(--brand-wash);
}
.drink-add:active { transform: scale(.99); }
.drink-add-plus {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--brand-wash);
  color: var(--brand-deep);
  font-size: 14px;
  line-height: 1;
  font-weight: 600;
}
.drink-add:hover .drink-add-plus { background: var(--brand); color: #fff; }

/* ---------- 历史菜单（最近一周） ---------- */
.history-box {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line-soft);
}
.history-list { display: flex; flex-direction: column; gap: 14px; }

.his-day {
  padding: 11px 13px;
  background: var(--bg);
  border-radius: var(--radius-sm);
}
.his-date {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
}
.his-count { font-size: 11.5px; font-weight: 400; color: var(--ink-mute); }

.his-slot { display: flex; gap: 9px; margin-top: 5px; }
.his-slot-name {
  flex-shrink: 0;
  width: 32px;
  font-size: 12px;
  color: var(--brand-deep);
  background: var(--brand-wash);
  border-radius: 5px;
  text-align: center;
  line-height: 20px;
  height: 20px;
}
.his-dishes {
  flex: 1;
  min-width: 0;
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height: 20px;
}
.order-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 10px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  transition: opacity .2s;
}
.order-thumb {
  width: 40px; height: 40px;
  border-radius: 10px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--brand-soft);
}
.order-info { flex: 1; min-width: 0; }
/* 菜名必须单行截断：否则被口味按钮挤窄后汉字会逐字竖排。
   flex-shrink 调大，保证口味标签先被压缩/换行，菜名本身保底 3.6em（约 4 个字）。 */
.order-name {
  flex: 1 1 4em;
  min-width: 3.6em;
  font-size: 14px;
  font-weight: 550;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.order-meta {
  font-size: 11.5px;
  color: var(--ink-mute);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* 做法：最多两行，超出省略 */
.order-recipe {
  margin-top: 4px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--ink-soft);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

iqkAmVk/DHFHc5yk7C3hdyEk20r0AKPkuPCHiRvBdKee4/alujQpTYR3YOUemohW25PEavyXsA30LS9eaBpiXz1Gsb6XJLiaoQUdQPWyFuZZJU509cUcRycqi0cmxbqkrvBDAIrbq3HZcaT+J7Xm9YBsgWeMHyUDn94eZB0yrRWLBkjNjpgd8564SMCPBRaSXxrVOrDnG4ujI3l/dRF3zxidjVyFLuaFUybmboxtZtSEn5q+s1u94Wp/yFj8EoRijd0pHUHjnTA6VvBeLrEzm45pG3cq1zr0Qe3TJLsXuo79Y+O2QmdLdA9tPdcSkyY03Ie+XNi7eF6suACJYMi+/2NT/YJWHb8kK6R+e0LROzu5B6xdB/2zt6vv9KstDQ8Ew7pJx3dqhQ2CCoJkJz/Tcoanfr2UzneBykC8IbqWOPVr4xJ4KzK+W8yM0lV6Sqh/GW1e0+wbu5eX35SLvP9CvZX1DqFR2GONeTHcNOnMMAp729CXZDpu9gaSXIYplGwyHy31ym0wgi2EdiKIWeurUlbBeINq7H1zJR/25u4lOg7mjEMtBpIxzFgANXDMJYu/PrbQHZjgPs6vtwNhL/ZuPHfNGuc+4qQNT7NbvoG4h5tMR6VxPQ1xlX4EMqeRq849BU05hnvPRLb2us9Pc+taHN4dfP3nu04PwRQisrwV9XbwCo9Lv/ALC+VB76N1+9X15aWpk/uF5KixSn3//vAKKsNO8VJ6d905PpqZA8sR/51yEPCEXwcxmzsyMD3/kP5Lh7IxcKl3gAAAAASUVORK5CYII= 红色圈叉，与菜单管理保持一致 */
.order-del {
  flex-shrink: 0;
  align-self: center;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  opacity: .62;
  transition: opacity .16s, background .16s;
}
.order-del img { width: 19px; height: 19px; display: block; }
.order-del:hover { opacity: 1; background: #FBEBE7; }
.order-del:active { opacity: 1; background: #F5DCD5; }

/* ---------- 菜单管理 ---------- */

/* 标签栏：自动换行，标签过多时排到下一行，不超出屏幕 */
/* 分类栏：下面直接就是菜品列表，中间没有说明文字行。
   这 12px 下间距原先是被删掉的那行操作说明顺带提供的（它 margin-bottom:12px），
   删掉后必须补到这里，否则分类栏会贴住第一张菜卡。 */
.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}
.chip {
  padding: 7px 14px;
  border-radius: 20px;
  background: var(--card);
  color: var(--ink-soft);
  font-size: 13px;
  white-space: nowrap;
  box-shadow: var(--shadow);
  transition: all .18s;
}
.chip.active { background: var(--brand); color: #fff; font-weight: 550; }

/* 标签 + 删除符号：编辑态下每个标签右侧带 × */
.chip-wrap { display: inline-flex; align-items: center; flex-shrink: 0; }
.chip-editing { padding-right: 12px; }
.chip-num { margin-left: 5px; font-size: 10.5px; opacity: .6; }
.chip-x {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px;
  margin-left: -2px;
  border-radius: 50%;
  color: var(--ink-mute);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  transition: background .16s, color .16s;
}
.chip-x:hover { background: #FBEBE7; color: var(--danger); }
.chip-x:active { background: #F5DCD5; color: #A8442F; }

/* 新增标签：绿色加号，与删除的 × 区分 */
.chip-add {
  background: transparent;
  color: #4C9A6A;
  border: 1px dashed #A8D5BC;
  box-shadow: none;
  font-size: 16px;
  font-weight: 600;
  padding: 5px 13px;
}
.chip-add:hover { background: #EDF7F1; border-color: #4C9A6A; }

/* 标签编辑入口：虚线样式区别于筛选标签 */
.chip-edit {
  background: transparent;
  color: var(--ink-mute);
  border: 1px dashed var(--line);
  box-shadow: none;
  padding: 6px 12px;
}
.chip-edit:hover { border-color: var(--brand); color: var(--brand); }
/* 编辑态：按钮文案变「完成」，用实色边框提示当前处于编辑模式 */
.chip-edit.on {
  background: var(--brand-wash);
  border-style: solid;
  border-color: var(--brand);
  color: var(--brand-deep);
  font-weight: 550;
}


/* 菜单：单列横向卡片，做法有足够宽度完整展示 */
.menu-list { display: flex; flex-direction: column; gap: 12px; }

/* ---------- 菜单管理分页（一页最多 7 道菜） ---------- */
.pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line-soft);
}
.pager.hidden { display: none; }
.pg-info {
  font-size: 12px;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}
.pg-nums {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.pg-btn {
  min-width: 36px;
  min-height: 36px;
  padding: 0 9px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
  font-size: 13.5px;
  font-weight: 550;
  font-variant-numeric: tabular-nums;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background .14s, color .14s, border-color .14s;
}
.pg-btn:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
.pg-btn.active {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
  font-weight: 650;
}
.pg-btn:disabled {
  opacity: .38;
  cursor: default;
}
/* 上一页/下一页的箭头：稍大一点好点 */
.pg-edge { font-size: 18px; line-height: 1; }
.pg-gap {
  padding: 0 2px;
  color: var(--ink-mute);
  font-size: 13px;
  user-select: none;
}
/* 窄屏：页码最多 5 个 + 首尾箭头 + 2 个省略号 = 9 个元素，默认尺寸放不下会换行。
   这里只压缩横向尺寸，高度仍保持 36px+，保证点得中。 */
@media (max-width: 380px) {
  .pager { gap: 6px; }
  .pg-nums { gap: 3px; }
  .pg-btn { min-width: 30px; padding: 0 6px; font-size: 13px; }
  .pg-gap { padding: 0 1px; font-size: 12px; }
}

/* 首页「今日饮品」的分页条：跟在列表下面，尺寸比菜单管理那条略紧凑，
   免得一个小卡片底下压一条很重的分页栏。
   注意：文件末尾有 `.pg-btn { min-height: 40px }` 的触摸兜底规则，
   `.pager-mini .pg-btn` 特异性更高会覆盖它 —— 高度不要低于 36px，
   否则首页这条分页在手机上难点中。 */
.pager-mini {
  margin-top: 12px;
  padding-top: 10px;
}
.pager-mini .pg-btn {
  min-width: 32px;
  min-height: 36px;
  padding: 0 8px;
  font-size: 13px;
  border-radius: 9px;
}
.pager-mini .pg-edge { font-size: 16px; }
.pager-mini .pg-info { font-size: 11.5px; }
.menu-card {
  position: relative;
  display: flex;
  align-items: stretch;
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform .14s;
}
.menu-card:active { transform: scale(.985); }
.menu-card .pic {
  width: 132px;
  flex-shrink: 0;
  align-self: stretch;
  object-fit: cover;
  background: var(--brand-soft);
}
.menu-card .info {
  flex: 1;
  min-width: 0;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
}

/* 卡片删除：常驻右侧，hover 才明显 */
/* 删除：与「加入」并排，图标按钮 */
.card-del {
  flex-shrink: 0;
  width: 30px; height: 30px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  opacity: .62;
  transition: opacity .16s, background .16s;
}
.card-del img { width: 19px; height: 19px; display: block; }
.card-del:hover { opacity: 1; background: #FBEBE7; }
.card-del:active { background: #F5DCD5; }

/* 菜名 + 分类标签同行，标签紧跟菜名，可换行 */
.nm-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 3px;
}
.menu-card .nm {
  font-size: 15px;
  font-weight: 600;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.menu-card .mt { font-size: 11.5px; color: var(--ink-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 做法：最多两行，超出省略，点击卡片可看全文 */
.menu-card .ck {
  margin-top: 6px;
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--ink-soft);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.menu-card .ct {
  flex-shrink: 0;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--brand-wash);
  color: var(--brand-deep);
  font-size: 11px;
  line-height: 1.5;
}

/* 卡片底部：仅放「加入」与删除键，靠右对齐 */
.card-foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 8px;
}
/* 「加入」与删除键同处右侧，底边对齐 */
.foot-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.card-add {
  flex-shrink: 0;
  padding: 5px 14px;
  border-radius: 14px;
  background: var(--brand-wash);
  color: var(--brand-deep);
  font-size: 12.5px;
  font-weight: 550;
  transition: all .18s;
}
.card-add:hover { background: var(--brand); color: #fff; }
.card-add.open { background: var(--brand); color: #fff; }

.menu-card { cursor: pointer; }

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%; max-width: 620px;
  display: flex;
  background: rgba(255, 255, 255, .95);
  backdrop-filter: saturate(180%) blur(12px);
  border-top: 1px solid var(--line-soft);
  padding-bottom: var(--safe-b);
  z-index: 30;
}
.tab {
  flex: 1;
  padding: 9px 4px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--ink-mute);
  transition: color .18s;
}
.tab.active { color: var(--brand); }
.tab-icon { width: 21px; height: 21px; display: block; }
.tab-icon svg { width: 100%; height: 100%; display: block; }
.tab-label { font-size: 10.5px; font-weight: 550; }

/* ---------- 弹层 ---------- */
.modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(58, 42, 33, .42); backdrop-filter: blur(2px); }
.modal-card {
  position: relative;
  width: 100%; max-width: 620px;
  max-height: 88vh;
  background: var(--card);
  border-radius: 22px 22px 0 0;
  display: flex; flex-direction: column;
  animation: slideUp .25s cubic-bezier(.32, .72, 0, 1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 12px;
  border-bottom: 1px solid var(--line-soft);
}
.modal-head h3 { margin: 0; font-size: 16.5px; font-weight: 650; }
.modal-body {
  padding: 18px 20px 22px;
  padding-bottom: calc(22px + env(safe-area-inset-bottom));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column; gap: 15px;
}
.modal-foot { display: flex; gap: 9px; align-items: center; justify-content: flex-end; padding-top: 4px; }
.modal-foot .btn-danger { margin-right: auto; }

/* ---------- 确认弹层：清空 / 删除前二次确认 ---------- */
#confirm-modal { z-index: 80; }
.modal-card-sm { max-width: 420px; }
.modal-card-sm .modal-body { overflow: visible; }
.confirm-body { padding: 24px 22px 6px; gap: 8px; }
.confirm-title { margin: 0; font-size: 17px; font-weight: 650; text-align: center; }
.confirm-text {
  margin: 0;
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink-soft);
  text-align: center;
}
.confirm-foot {
  display: flex;
  gap: 10px;
  padding: 14px 22px calc(20px + env(safe-area-inset-bottom));
}
.confirm-foot button { flex: 1; min-height: 44px; justify-content: center; }

/* ---------- 批量删除危险区 ---------- */
.danger-zone {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 18px;
  padding: 14px 16px;
  border: 1px dashed #E8C4B8;
  border-radius: var(--radius);
  background: #FDF6F3;
}
.danger-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.danger-text strong { font-size: 13.5px; font-weight: 600; color: var(--danger); }
.danger-text span { font-size: 11.5px; color: var(--ink-mute); line-height: 1.45; }
.danger-actions { display: flex; gap: 8px; flex-shrink: 0; }
.danger-zone .btn-danger { margin-right: 0; }

.head-actions { display: flex; align-items: center; gap: 14px; }

/* ---------- 删除历史 ---------- */
.trash-box {
  padding: 14px 15px;
  margin-bottom: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow);
}
.trash-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 4px;
}
.trash-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.trash-tip { margin: 0 0 12px; font-size: 12px; color: var(--ink-mute); }
.trash-list { display: flex; flex-direction: column; gap: 8px; }

.trash-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 11px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  opacity: .82;
}
.trash-thumb {
  width: 42px; height: 42px;
  border-radius: 9px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--brand-soft);
}
.trash-info { flex: 1; min-width: 0; }
.trash-name {
  font-size: 14px; font-weight: 550;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.trash-meta { font-size: 11.5px; color: var(--ink-mute); }
.trash-item .btn-ghost { flex-shrink: 0; color: var(--brand-deep); border-color: var(--brand-soft); }
.trash-item .btn-ghost:hover { background: var(--brand-wash); }

/* 实时保存状态提示 */
.save-state {
  margin-right: auto;
  font-size: 12px;
  color: var(--ink-mute);
  transition: color .2s;
}
.save-state.ok { color: var(--brand); }
.save-state.err { color: var(--danger); }

/* ---------- 照片选择 ---------- */
.photo-picker { display: flex; gap: 13px; align-items: flex-start; }
.photo-box {
  width: 96px; height: 96px;
  border-radius: 12px;
  border: 1px dashed var(--line);
  background: var(--bg);
  overflow: hidden;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.photo-box img { width: 100%; height: 100%; object-fit: cover; }
.photo-actions { display: flex; flex-direction: column; gap: 8px; }

/* ---------- 提示 ---------- */
.toast {
  position: fixed;
  left: 50%; bottom: 92px;
  transform: translate(-50%, 14px);
  padding: 10px 20px;
  border-radius: 22px;
  background: rgba(58, 42, 33, .93);
  color: #fff;
  font-size: 13.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s, transform .22s;
  z-index: 90;
  max-width: 80vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.empty {
  padding: 30px 16px;
  text-align: center;
  color: var(--ink-mute);
  font-size: 13px;
}
.empty .big { display: block; font-size: 26px; margin-bottom: 8px; opacity: .55; }

/* 三张空状态配图统一尺寸，视觉更整齐 */
.empty-gif,
.empty-want,
.empty-cook {
  display: block;
  width: 112px;
  height: auto;
  margin: 0 auto 10px;
}

.spinner {
  padding: 40px 0;
  text-align: center;
  color: var(--ink-mute);
  font-size: 13px;
}

/* ---------- 手机适配 ---------- */

/* 小屏手机（iPhone SE 等）：收紧间距与猫咪占位 */
@media (max-width: 380px) {
  .stat-num { font-size: 33px; }
  .stat-label { font-size: 14.5px; }
  .stat-icon { height: 32px; }
  .stat { padding: 14px 9px 14px 10px; row-gap: 4px; }
  /* 窄屏卡片更窄，「记下」按钮左缘到 232px，图缩到 168px、右移到按钮左侧 */
  .card-wish::before { opacity: .12; background-size: 168px auto; background-position: right 72px top 58px; }
  /* 饮品背景卡在窄屏降一点高度，否则一张图占满屏、下面按钮被推太远 */
  #order-card.drink-mode { min-height: 208px; }
  .hero-mascot { width: 104px; right: -12px; bottom: -14px; }
  .hero-body { padding-right: 100px; }
  .hero-title { font-size: 19px; }

  .main { padding: 16px 14px 112px; }
  .topbar-inner { padding-left: 14px; padding-right: 14px; }
  .card { padding: 15px 13px; }
  .page-head h2 { font-size: 20px; }
  .menu-card .pic { width: 108px; }
  .hero { padding: 20px 16px; }
  .modal-body { padding-left: 16px; padding-right: 16px; }
  .date-nav input { padding: 4px 3px; font-size: 13px; }
}

/* 常规手机（≤430px）：略微收紧横向留白 */
@media (max-width: 430px) {
  .main { padding: 18px 16px 116px; }
  .topbar-inner { padding-left: 16px; padding-right: 16px; }
  .tab-label { font-size: 10px; }
}

/* 小屏横屏（如 iPhone 横放）：屏幕高度有限，压缩纵向占用 */
@media (max-height: 460px) and (orientation: landscape) {
  .hero { padding: 16px 18px; }
  .hero-mascot { width: 84px; bottom: -10px; }
  .hero-title { font-size: 18px; }
  .main { padding-top: 14px; }
  .empty-gif, .empty-want, .empty-cook { width: 84px; }
}

/* 触摸设备：去掉 hover 依赖，避免点击后样式残留 */
@media (hover: none) {
  .card-del { opacity: .55; }
  .card-del:active { opacity: 1; }
}

/* =========================================================
   手机适配补充（放在文件末尾以确保优先级）
   前面的触控规则会被后续同名选择器覆盖，故在此统一兜底
   ========================================================= */

/* 所有可点击元素统一 ≥40px，手指更容易点中 */
.btn-primary,
.btn-ghost,
.btn-danger,
.btn-icon,
.card-add,
.card-del,
.chip-x,
.chip-add,
.chip-edit,
.order-del,
.mini-del,
.seg-btn,
.slot-tab,
.chip,
.stat,
.trash-item .btn-ghost,
.trash-item .order-del,
  .photo-actions button,
  .day-nav button,
  .pg-btn {
  min-height: 40px;
}
.btn-sm { min-height: 40px; padding-top: 10px; padding-bottom: 10px; }

/* 底部导航与分段控件的点击区域 */
.tab { min-height: 48px; }
/* 竖排餐次栏：靠内边距撑到 44px，手指点得准 */
.slot-tab { min-height: 44px; padding: 12px 2px; }
.seg-btn { padding: 10px 8px; }

/* 文字型按钮：靠内边距撑开点击区 */
.btn-link { padding: 8px 0; min-height: 40px; display: inline-flex; align-items: center; }

/* 头像（点开设置名字）：视觉34px，点击区扩到 40px */
.avatar { position: relative; }
.avatar::after {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  width: 40px; height: 40px;
  transform: translate(-50%, -50%);
}

/* 禁用双击缩放带来的 300ms 延迟（已用 touch-action，此处兜底 iOS） */
button, .chip, .tab, .slot-tab, .seg-btn, .stat { touch-action: manipulation; }

/* 键盘弹起时，弹层内容可滚动且不被遮挡 */
@media (max-width: 500px) {
  .modal-card { max-height: 88vh; }
  .modal-body { padding-bottom: calc(22px + env(safe-area-inset-bottom)); }
  /* 弹层内的按钮更宽，手指更好按 */
  .modal-foot .btn-primary,
  .modal-foot .btn-danger { min-height: 44px; padding-left: 22px; padding-right: 22px; }
  /* 危险区按钮竖排，避免两按钮挤在一起 */
  .danger-actions { width: 100%; }
  .danger-actions .btn-ghost,
  .danger-actions .btn-danger { flex: 1; }
}

/* 超窄屏（iPhone SE 等）：进一步压缩但保证可点 */
@media (max-width: 360px) {
  .main { padding: 14px 12px 112px; }
  .topbar-inner { padding-left: 12px; padding-right: 12px; }
  /* 窄屏顶栏空间紧张：涂鸦缩一档，避免挤到右侧头像 */
  .brand-mascot { height: 25px; }
  .brand-name { font-size: 15px; }
  .card { padding: 14px 12px; }
  .menu-card .pic { width: 96px; }
  .danger-zone { flex-direction: column; align-items: stretch; }
  .danger-actions { flex-direction: column; }
  /* 左侧餐次栏再收窄，给右侧内容留空间 */
  .slot-rail { width: 50px; }
  .order-layout { gap: 8px; }
  .slot-tab { font-size: 12.5px; }
  /* 菜品库标签栏同样收窄 */
  .pick-rail { width: 60px; }
  .pick-layout { gap: 9px; }
  .pick-tab { font-size: 12.5px; }
  .pick-row { gap: 9px; padding: 8px; }
  .pick-thumb { width: 42px; height: 42px; }
  .pick-name { font-size: 14.5px; }
  /* 四列表格在窄屏收窄列间距与字号，菜名列可换行，保证不横向溢出 */
  .meal-table { font-size: 12.5px; }
  .meal-table th,
  .meal-table td { padding: 8px 2px; }
  .meal-table th { font-size: 11.5px; }
  .meal-table .c-slot { padding-right: 6px; }
  .meal-table .c-taste { padding-left: 6px; padding-right: 6px; }
  .meal-table .taste-pill { max-width: 62px; padding: 2px 6px; font-size: 11px; }
  .meal-table .c-who { padding-left: 6px; font-size: 12px; }
  /* 饮品口味比正餐长（甜度+浓度+冰量+其他），窄屏列宽压到 92px，
     标签单行显示、超出走省略号（点开弹层能看全文）。
     min-width 同步下调（72 + 左右 padding 10 = 92），这条才是真正钉住列宽的 */
  .drink-table .taste-pill { font-size: 11px; min-width: 72px; max-width: 72px; }
  .drink-table .c-taste { width: 92px; padding-left: 5px; padding-right: 5px; }
  .drink-table .c-del,
  .drink-table th.c-del { padding-left: 3px; padding-right: 0; }
  /* 点餐行在窄屏更紧凑：口味备注更贴紧菜名 */
  .order-taste { padding: 3px 7px; font-size: 10.5px; }
  /* 分类下拉在窄屏适当加高选项，保证 42px 触控目标 */
  .cat-panel { max-height: 208px; }
  .cat-opt { min-height: 44px; }
}

/* 删除历史：窄屏下缩略图与按钮会让文字区过窄，改为上下两行 */
@media (max-width: 420px) {
  .trash-item {
    display: grid;
    grid-template-columns: 40px 1fr;
    grid-template-areas: "thumb info" "actions actions";
    gap: 8px 10px;
    align-items: center;
  }
  .trash-thumb { grid-area: thumb; width: 40px; height: 40px; }
  .trash-info { grid-area: info; }
  .trash-item .btn-ghost,
  .trash-item .order-del { grid-area: actions; }
  /* .order-del 现在是 30px 宽的图片按钮，右侧留出的空间同步放大 */
  .trash-item .btn-ghost { width: 100%; min-height: 40px; margin-right: 44px; }
  .trash-item .order-del {
    position: absolute;
    right: 12px;
  }
  .trash-item { position: relative; }
}

/* =========================================================
   今日美食表格（首页）
   ========================================================= */
.meal-table-box { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.meal-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
.meal-table th,
.meal-table td {
  padding: 9px 6px;
  text-align: left;
  border-bottom: 1px solid var(--line-soft);
  white-space: nowrap;
}
.meal-table th {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-mute);
  background: var(--line-soft);
}
.meal-table th:first-child { border-radius: 8px 0 0 8px; }
.meal-table th:last-child { border-radius: 0 8px 8px 0; }
.meal-table tbody tr:last-child td { border-bottom: none; }
.meal-table .c-slot {
  width: 1%;
  color: var(--brand-deep);
  font-weight: 550;
  padding-right: 10px;
}
/* 菜名列是唯一可伸缩列（width:100%），允许换行，
   这样窄屏下表格最小宽度不会超过容器，不需要左右滑动 */
.meal-table .c-dish {
  width: 100%;
  color: var(--ink);
  white-space: normal;
  word-break: break-word;
}
/* 口味列：无备注时用浅色破折号占位，保持列宽稳定 */
.meal-table .c-taste {
  width: 1%;
  padding-left: 10px;
  padding-right: 10px;
  white-space: nowrap;
}
.meal-table .taste-pill {
  display: inline-block;
  max-width: 88px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--brand-wash);
  color: var(--brand-deep);
  font-size: 11.5px;
  font-weight: 550;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: middle;
}
.meal-table .taste-none { color: var(--ink-mute); opacity: .5; }
.meal-table .c-who {
  width: 1%;
  color: var(--ink-mute);
  font-size: 12.5px;
  padding-left: 10px;
}

/* =========================================================
   今日饮品（首页）：与「今日美食」同款表格
   列：饮品 / 口味 / 点餐人 / 删除。
   口味标签是按钮（点了开饮品口味弹层），要覆盖掉
   .meal-table .taste-pill 原本给 span 的样式，改成可点击态。
   ========================================================= */
.drink-table .c-dish { font-weight: 550; }
/* 口味列给固定 width，让它和「点餐人」一样不被 .c-dish 抢走空间。 */
.drink-table .c-taste {
  width: 104px;
  white-space: nowrap;
}
/* 单行显示、写不下用省略号 —— 和「今日美食」的口味列完全一致。
   min-width 仍是必需的那一半：table-layout:auto 下 width 只是「建议」，
   .c-dish 带 width:100% 会先 greedily 吃掉全部宽度，口味列按内容收缩。
   如果不给内容 min-width，标签的最小内容宽度只有一个字（约 32px），
   整列会被压到 70px、标签被挤成只剩一个字。
   标签本身 display:inline-block + width:100%，文字超出走 ellipsis。 */
.drink-table .taste-pill {
  display: inline-block;
  width: auto;
  min-width: 84px;
  /* max-width 必须给固定像素，不能写 100%。
     表格是 auto布局，单元格宽度本身由内容决定 —— 写 max-width:100% 会形成
     「标签宽度=列宽、列宽=标签宽度」的循环，浏览器把它解成整列被内容撑开
     （实测标签到了 228px，口味列变得比菜名列还宽）。
     给死 84px = 列内容区宽（104 - 左右 padding 20），省略号才会正确出现在格子里。 */
  max-width: 84px;
  overflow: hidden;
  text-overflow: ellipsis;
  border: none;
  font-family: inherit;
  line-height: 1.5;
  text-align: left;
  cursor: pointer;
  white-space: nowrap;
  word-break: normal;
  vertical-align: middle;
}
.drink-table .taste-pill.taste-edit:hover { background: #F6E4DE; color: var(--brand); }
/* 无口味时的空态小按钮：虚线框 + 淡色，跟正餐「—」占位同一视觉重量。
   display:inline-block + min-width:0 覆盖上面的 block/min-width，让它按内容宽度显示、不占满整格 */
.drink-table .taste-pill.taste-add {
  display: inline-block;
  width: auto;
  min-width: 0;
  padding: 2px 8px;
  background: transparent;
  color: var(--ink-mute);
  box-shadow: inset 0 0 0 1px var(--line);
  white-space: nowrap;
}
.drink-table .taste-pill.taste-add:hover { background: var(--brand-wash); color: var(--brand-deep); }
/* 末列删除：今日美食与今日饮品共用的列，写在公共层而不是 .drink-table 下，
   否则美食表没有末列样式。两表的删除键视觉必须一致。 */
.meal-table th.c-del,
.meal-table .c-del { width: 1%; padding-left: 6px; padding-right: 2px; }
.meal-table .mini-del { width: 24px; height: 24px; }

/* =========================================================
   固定餐饮 = 菜品库：左侧标签栏 + 右侧菜品列表
   ========================================================= */
#view-fixed .field-tip { margin: -6px 0 14px; }
#view-fixed .field-tip b { color: var(--brand-deep); }

.pick-layout { display: flex; align-items: flex-start; gap: 12px; }

/* 左侧标签栏：竖排滚动，选中项白底胶囊浮出 */
.pick-rail {
  flex-shrink: 0;
  width: 72px;
  max-height: calc(100vh - 190px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 5px 4px;
  border-radius: 14px;
  background: #F2ECE7;
  position: sticky;
  top: 76px;
}
.pick-tab {
  flex-shrink: 0;
  display: block;
  width: 100%;
  min-height: 40px;
  padding: 10px 2px;
  border-radius: 10px;
  background: transparent;
  color: var(--ink-mute);
  font-size: 13px;
  line-height: 1.35;
  text-align: center;
  word-break: break-all;
  transition: background .18s, color .18s;
}
.pick-tab.active {
  background: var(--card);
  color: var(--brand-deep);
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(90, 58, 42, .12);
}

.pick-main { flex: 1; min-width: 0; }

/* 右侧菜品行：缩略图 + 菜名食材 + 已在当日的勾 + 加号 */
.pick-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pick-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  background: var(--card);
  box-shadow: 0 1px 2px rgba(90, 58, 42, .05);
}
.pick-thumb {
  width: 46px; height: 46px;
  border-radius: 10px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--brand-soft);
}
.pick-info { flex: 1; min-width: 0; }
.pick-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pick-meta {
  margin-top: 2px;
  font-size: 12.5px;
  color: var(--ink-mute);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pick-done {
  flex-shrink: 0;
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--brand-soft);
  color: var(--brand-deep);
  font-size: 12px;
}
.pick-add {
  flex-shrink: 0;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--line-soft);
  color: var(--brand-deep);
  font-size: 20px;
  line-height: 1;
  transition: background .18s;
}
.pick-add:active { background: var(--brand-soft); }

/* 餐次选择弹层：三选一 + 取消 */
#slot-picker { z-index: 85; }
.slot-picker-foot { padding: 14px 22px 0; }
.slot-choice {
  flex: 1;
  min-height: 46px;
  border-radius: var(--radius-sm);
  background: var(--brand-wash);
  color: var(--brand-deep);
  font-size: 15px;
  font-weight: 600;
  transition: background .18s;
}
.slot-choice:active { background: var(--brand-soft); }
.slot-picker-cancel { padding: 10px 22px calc(18px + env(safe-area-inset-bottom)); }
.slot-picker-cancel .btn-ghost { width: 100%; min-height: 42px; justify-content: center; }

/* 点餐页顶部「固定餐饮」入口：一行文字链，通往二级页 */
.fixed-entry {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 46px;
  margin: -4px 0 14px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: var(--brand-wash);
  text-align: left;
  transition: background .18s;
}
.fixed-entry:active { background: var(--brand-soft); }
.fixed-entry-text { flex-shrink: 0; font-size: 14px; font-weight: 600; color: var(--brand-deep); }
.fixed-entry-sub {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 12px; color: var(--ink-mute); text-align: right;
}
.fixed-entry-arrow { flex-shrink: 0; font-size: 17px; line-height: 1; color: var(--brand); }

/* 点餐内容区的日期提示（餐次标识已在左侧栏） */
.order-hint {
  margin: 0 0 12px;
  font-size: 12.5px;
  color: var(--ink-mute);
}

/* ===== 独立饮品栏目：整卡铺满插画背景 =====
   素材是接近正方形的一图（900×857），而卡片是扁宽的，
   直接铺会显得空、也会被拉伸变形，所以给它一个最小高度，

  padding: 18px 16px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,.82);
  color: var(--ink-soft);
  font-weight: 600;
}
#order-card.drink-mode .drink-empty span { color: var(--ink-mute); font-weight: 400; }

/* 虚线的「添加饮品」是透明框，压在图上看不清边，给一点白底 */
#order-card.drink-mode .drink-add { background: rgba(255,255,255,.78); }

function todayStr(d) {
  const x = d ? new Date(d) : new Date();
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
}

function shiftDate(str, days) {
  const [y, m, d] = str.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  return todayStr(dt);
}

function prettyDate(str) {
  if (str === todayStr()) return '今天 · ' + str.slice(5).replace('-', ' / ');
  if (str === shiftDate(todayStr(), -1)) return '昨天 · ' + str.slice(5).replace('-', ' / ');
  if (str === shiftDate(todayStr(), 1)) return '明天 · ' + str.slice(5).replace('-', ' / ');
  return str.slice(5).replace('-', ' / ');
}

function toast(msg) {

function escapeHtml(s) {

    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// =========================================================

const confirmModal = document.getElementById('confirm-modal');
let confirmState = null;

/**
 * 弹出确认框，resolve true 表示用户点了确认。
 * @param {object} opt
 *  - title 标题
 *  - text  说明文字（可含 \n，会按行拆分）
 *  - okText 确认按钮文案
 *  - danger 是否危险操作（确认键用红色）
 */
function confirmAction(opt) {
  const o = opt || {};
  return new Promise(resolve => {
    confirmState = { resolve };
    document.getElementById('confirm-title').textContent = o.title || '确认操作';
    const p = document.getElementById('confirm-text');
    p.textContent = '';
    String(o.text || '').split('\n').forEach((line, i) => {
      if (i) p.appendChild(document.createElement('br'));
      p.appendChild(document.createTextNode(line));
    });
    const okBtn = document.getElementById('confirm-ok');
    okBtn.textContent = o.okText || '确认删除';
    okBtn.classList.toggle('btn-danger', o.danger !== false);
    okBtn.classList.toggle('btn-primary', o.danger === false);
    confirmModal.classList.remove('hidden');
  });
}

function settleConfirm(result) {
  const st = confirmState;
  if (!st) return;
  confirmState = null;
  confirmModal.classList.add('hidden');
  st.resolve(result);
}

document.getElementById('confirm-ok').addEventListener('click', () => settleConfirm(true));
document.getElementById('confirm-cancel').addEventListener('click', () => settleConfirm(false));
confirmModal.querySelector('[data-confirm-cancel]').addEventListener('click', () => settleConfirm(false));
// 点确认框外的遮罩也算取消，避免误触丢失上下文
confirmModal.addEventListener('click', e => { if (e.target === confirmModal) settleConfirm(false); });
// 确认框优先级最高：打开时屏蔽 Esc / 背景弹层的关闭逻辑
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !confirmModal.classList.contains('hidden')) {
    e.stopImmediatePropagation();

}, true);

// =========================================================
// 无照片时的文字图：按菜名生成配色卡片
// =========================================================

// 无照片时的文字图配色：暖色系，与整体风格一致
const PLACEHOLDER_COLORS = [
  ['#F6DCCC', '#B8543A'],
  ['#F9E3C4', '#A9702A'],
  ['#F7DCD2', '#A85A44'],
  ['#FBE6D2', '#B0714A'],
  ['#F5DFD2', '#9C5F3E'],
  ['#F8E8D8', '#8F5B44'],
];

const placeholderCache = new Map();

function placeholderImage(name, ratio) {
  const key = name + '|' + ratio;
  if (placeholderCache.has(key)) return placeholderCache.get(key);

  const w = ratio === 'menu' ? 400 : 160;
  const h = ratio === 'menu' ? 300 : 160;
  const pair = PLACEHOLDER_COLORS[hashCode(name) % PLACEHOLDER_COLORS.length];
  const chars = Array.from(String(name || '菜')).slice(0, 4);

  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');

  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, pair[0]);
  g.addColorStop(1, shade(pair[0], -14));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // 柔和光斑，避免大面积纯色显得单薄
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(w * 0.76, h * 0.22, w * 0.30, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  const twoLine = chars.length > 2;
  const perLine = twoLine ? Math.ceil(chars.length / 2) : chars.length;
  const lines = twoLine
    ? [chars.slice(0, perLine).join(''), chars.slice(perLine).join('')]
    : [chars.join('')];

  const size = ratio === 'menu'
    ? (lines.length > 1 ? 62 : 82)
    : (lines.length > 1 ? 28 : 36);
  ctx.fillStyle = pair[1];
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `600 ${size}px "PingFang SC", "Microsoft YaHei", sans-serif`;

  const lineH = size * 1.22;
  const startY = h / 2 - ((lines.length - 1) * lineH) / 2;
  lines.forEach((ln, i) => ctx.fillText(ln, w / 2, startY + i * lineH));

  const url = cv.toDataURL('image/png');
  placeholderCache.set(key, url);
  return url;
}

function hashCode(s) {
  let h = 0;
  for (let i = 0; i < String(s).length; i++) h = (h * 31 + String(s).charCodeAt(i)) | 0;
  return Math.abs(h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const cl = v => Math.max(0, Math.min(255, v));
  const r = cl((n >> 16) + amt), g = cl(((n >> 8) & 0xff) + amt), b = cl((n & 0xff) + amt);
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

/** 菜品图：有照片用照片，没有则回退到文字图 */
function dishImg(d, ratio) {
  return d && d.image_data ? d.image_data : placeholderImage(d ? d.name : '菜', ratio);
}

// =========================================================
// 图片压缩：控制体积，适配数据库存储
// =========================================================

function compressImage(file, maxSide = 800) {
  return new Promise((resolve, reject) => {
    if (!file.type || !file.type.startsWith('image/')) {
      return reject(new Error('请选择图片文件'));
    }
    if (file.size > 12 * 1024 * 1024) {
      return reject(new Error('图片太大了，请选一张小于 12MB 的'));
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('图片读取失败'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('图片解析失败'));
      img.onload = () => {
        let { width: w, height: h } = img;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale);
        h = Math.round(h * scale);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// =========================================================
// 菜品删除：移入回收站（可恢复），而非直接抹除
// =========================================================

/**
 * 把一道菜移入回收站：先存快照，再删原表。
 * 快照保留菜名/分类/照片/食材/做法，恢复后可完整还原。
 */
async function moveToTrash(dish) {
  // 必须返回真实记录：回收站主键是 bigint，前端自造的临时 id
  // 无法用于后续的恢复/彻底删除操作。
  const { data: insData, error: insErr } = await cloud.database.from('trash_dishes')
    .insert({
      origin_id: dish.id,
      name: dish.name,
      category: dish.category,
      image_data: dish.image_data || null,
      ingredients: dish.ingredients,
      note: dish.note,
    }).select();
  if (insErr) return { error: insErr };
  if (!insData || !insData.length) return { error: new Error('移入删除历史失败') };

  const { data, error } = await cloud.database
    .from('dishes').delete().eq('id', dish.id).select();
  if (error) {
    // 原菜删不掉时把快照也清掉，避免回收站留下脏数据
    await cloud.database.from('trash_dishes').delete().eq('id', insData[0].id);
    return { error };
  }
  if (!data || !data.length) {
    await cloud.database.from('trash_dishes').delete().eq('id', insData[0].id);
    return { notFound: true };
  }
  return { ok: true, record: insData[0] };
}

/**
 * 批量移入回收站。
 * @param {object} opt - ids: 要处理的菜品 id 数组
 */
async function bulkTrash(opt) {
  const ids = opt.ids || [];
  if (!ids.length) {
    toast(opt.emptyText || '没有可删除的内容');
    return;
  }

  // 先确认再删，避免误触
  const c = opt.confirm || {};
  const ok = await confirmAction({
    title: c.title || '确认删除全部菜品？',
    text: (c.text || '').replace('{n}', ids.length),
    okText: c.okText || '确认删除',
  });
  if (!ok) return;

  let moved = 0;
  for (const id of ids) {
    const dish = state.dishes.find(d => d.id === id);
    if (!dish) continue;
    const res = await moveToTrash(dish);
    if (res.error || res.notFound) {
      toast(`已移入回收站 ${moved}/${ids.length} 道后出错：${(res.error && res.error.message) || '菜品不存在'}`);
      await refresh();
      return;
    }
    moved++;
  }

  toast(opt.doneText || '已移入回收站');
  await refresh();
}

// =========================================================
// 批量删除：执行前统一经过 confirmAction 二次确认
// =========================================================

/**
 * 通用批量删除。
 * @param {object} opt
 *  - ids       要删除的 id 数组（逐条删除，范围可精确核对）
 *  - confirm   { title, text, okText } 确认弹层文案
 *  - run对单个 id 执行删除
 */
async function bulkDelete(opt) {
  const ids = opt.ids || [];
  const n = ids.length;
  if (n === 0) {
    toast(opt.emptyText || '没有可删除的内容');
    return;
  }

  // 先确认再删，避免误触直接丢数据
  const c = opt.confirm || {};
  const ok = await confirmAction({
    title: c.title || '确认清空？',
    text: (c.text || '').replace('{n}', n),
    okText: c.okText || '确认清空',
  });
  if (!ok) return;

  // 逐条删除：任一条失败即中止，并明确告知已删除多少条
  let removed = 0;
  for (const id of ids) {
    const { error } = await opt.run(id);
    if (error) {
      toast(`已删除 ${removed}/${n} 条后出错：${error.message}`);
      await refresh();
      return;
    }
    removed++;
  }

  toast(opt.doneText || '已清空');
  await refresh();
}

// 菜单：删除全部菜品（移入回收站，可在「删除历史」里恢复）
document.getElementById('clear-dishes-btn').addEventListener('click', async () => {
  let ids = state.dishes.map(d => d.id);
  const { data, error } = await cloud.database.from('dishes').select('id').limit(1000);
  if (!error && Array.isArray(data)) ids = data.map(r => r.id);

  bulkTrash({
    ids,
    emptyText: '菜单里还没有菜品',
    confirm: {
      title: '删除全部菜品？',
      text: '共 {n} 道菜会移入「删除历史」。\n之后可以从删除历史里恢复。',
      okText: '全部移入删除历史',
    },
    doneText: '已全部移入回收站，可从删除历史恢复',
  });
});

// 点餐：清空当前餐次
document.getElementById('clear-slot-btn').addEventListener('click', () => {
  bulkDelete({
    ids: state.orders
      .filter(o => o.order_date === state.date && o.slot === state.slot)
      .map(o => o.id),
    emptyText: `${state.slot}没有安排`,
    confirm: {
      title: `清空${prettyDate(state.date)}的${state.slot}？`,
      text: '共 {n} 条安排会被移除，此操作不可恢复。',
      okText: '确认清空',
    },
    doneText: `${state.slot}已清空`,
    run: id => cloud.database.from('meal_orders').delete().eq('id', id).select(),
  });
});

/**
 * 首页两张小卡片的分页条（今日饮品 / 灵感咕）。
 * 比菜单管理那条更紧凑，且页码全部列出、不做「…」省略 ——
 * 这两张卡的数据量本来就小，为 3 页多点一次不值得。
 * @param unit 量词：饮品用「杯」，想法用「条」
 */
function renderMiniPager(pager, page, pages, total, start, shown, unit) {
  if (pages <= 1) { pager.classList.add('hidden'); pager.innerHTML = ''; return; }
  pager.classList.remove('hidden');

  let nums = '';
  for (let p = 1; p <= pages; p++) {
    nums += `<button class="pg-btn${p === page ? ' active' : ''}" data-mpg="${p}" type="button"${p === page ? ' aria-current="page"' : ''}>${p}</button>`;
  }
  const html =
    `<button class="pg-btn pg-edge" data-mpg="${page - 1}" type="button"${page === 1 ? ' disabled' : ''} aria-label="上一页">‹</button>` +
    nums +
    `<button class="pg-btn pg-edge" data-mpg="${page + 1}" type="button"${page === pages ? ' disabled' : ''} aria-label="下一页">›</button>`;

  pager.innerHTML = `
    <div class="pg-info">第 ${start + 1}-${start + shown} ${unit} · 共 ${total} ${unit}</div>
    <div class="pg-nums">${html}</div>`;
}

/** 把时间戳格式化为「10-05 14:32」 */
function formatStamp(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

document.getElementById('quick-wish-btn').addEventListener('click', async () => {
  const input = document.getElementById('quick-wish');
  const title = input.value.trim();
  if (!title) return toast('先写点什么吧');
  const { error } = await cloud.database.from('wish_items').insert({
    owner_name: me(), title, kind: 'dish', status: 'pending',
  });
  if (error) return toast(error.message);
  input.value = '';
  toast('已记下');
  await refresh();
});

document.getElementById('quick-wish').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('quick-wish-btn').click();
});

// 随手记：删除单条
document.getElementById('home-wishes').addEventListener('click', async e => {
  const btn = e.target.closest('[data-del-quick]');
  if (!btn) return;
  const item = state.wishes.find(w => String(w.id) === btn.dataset.delQuick);
  const ok = await confirmAction({
    title: '删除这条想法？',
    text: `「${item ? item.title : ''}」将被移除，此操作不可恢复。`,
    okText: '确认删除',
  });
  if (!ok) return;
  const { error } = await cloud.database
    .from('wish_items').delete().eq('id', btn.dataset.delQuick).select();
  if (error) return toast(error.message);
  toast('已删除');
  await refresh();
});

/** 点餐列表里的一行：缩略图 + 菜名/点餐人 + 口味备注按钮 + 删除 */

  // 图片与做法实时取自菜单：菜品换图、改做法后这里同步更新
  const src = state.dishes.find(d => d.id === o.dish_id);
  const img = dishImg(src || { name: o.dish_name, image_data: o.dish_image }, 'thumb');
  const recipe = (src && src.note) || o.note || '';
  const taste = (o.taste || '').trim();
  return `
  <div class="order-item" data-order="${o.id}">
    <img class="order-thumb" src="${img}" alt="">

      <div class="order-name-row">

/**
 * 饮品视图：左侧栏底部「饮品」点开的清单。
 * 它不占用早/午/晚，纯粹是把当天已排的饮品列出来，方便一眼看完。
 */
function renderDrinkList(list) {
  const drinks = state.orders.filter(o => o.order_date === state.date && o.slot === '饮品');
  // 底部常驻一个「添加饮品」入口：饮品不分餐次，随时能加
  const addBtn = `
    <button class="drink-add" data-drink-add type="button">
      <span class="drink-add-plus" aria-hidden="true">+</span>
      <span>添加饮品</span>
    </button>`;

  if (!drinks.length) {
    // 空态不再插图：整卡已经是插画背景，再叠一张小图会打架
    list.innerHTML = `<div class="empty drink-empty">今天还没安排饮品<br><span style="font-size:12px">饮品不分餐次，随时可以加</span></div>${addBtn}`;
    return;
  }
  list.innerHTML = drinks.map(o => {
    const src = state.dishes.find(d => d.id === o.dish_id);
    const img = dishImg(src || { name: o.dish_name, image_data: o.dish_image }, 'thumb');
    const taste = (o.taste || '').trim();
    return `
    <div class="order-item" data-order="${o.id}">
      <img class="order-thumb" src="${img}" alt="">
      <div class="order-info">
        <div class="order-name-row drink-row">
          <span class="order-name">${escapeHtml(o.dish_name || '未命名')}</span>
          <button class="order-taste drink-taste${taste ? ' has' : ''}" data-taste="${o.id}" type="button"
                  title="${taste ? '口味：' + escapeHtml(taste) + '（点击修改）' : '选择甜度、冰量、浓度等'}"
                  aria-label="饮品口味">${taste ? escapeHtml(taste) : '+ 口味'}</button>
        </div>
        <div class="order-meta">${escapeHtml(o.owner_name || me())}</div>

/** 「添加饮品」：跳到加菜页并直接定位到饮品标签 */
function goPickDrink() {
  state.showDrink = true;
  state.pickCat = '饮品';
  go('fixed');
}

async function deleteOrder(id) {
  const item = state.orders.find(o => String(o.id) === String(id));
  const where = item && item.slot === '饮品' ? '今日饮品' : (item ? item.slot : '');
  const ok = await confirmAction({
    title: item && item.slot === '饮品' ? '从今日饮品移除？' : '从这一餐移除？',
    text: `「${item ? (item.dish_name || '未命名') : '这道菜'}」会从${where}移除，此操作不可恢复。`,
    okText: '确认移除',
  });
  if (!ok) return;
  const { data, error } = await cloud.database
    .from('meal_orders').delete().eq('id', id).select();
  if (error) return toast(error.message);
  if (!data || !data.length) return toast('这条记录可能已经不在了');
  toast('已移除');
  await refresh();
}

// =========================================================
// 口味备注：给某条点餐写「少盐 / 不辣」这类要求
// =========================================================

// 正餐快捷标签：咸淡辣度、忌口
const TASTE_PRESETS = ['少盐', '少油', '不辣', '加辣', '不要香菜', '多醋', '免葱蒜', '加糖'];
// 饮品快捷标签：参考点奶茶，分甜度 / 浓度 / 冰量 / 温度四组
// 每组内部互斥（点一个即选中同组其他），可跨组组合，如「三分糖 · 少冰 · 浓」
const DRINK_TASTE_GROUPS = [
  { key: '甜度', items: ['标准糖', '少糖', '三分糖', '五分糖', '不另加糖', '半糖'] },
  { key: '浓度', items: ['正常浓度', '加浓', '减淡'] },
  { key: '冰量', items: ['正常冰', '少冰', '去冰', '温', '热'] },
  { key: '其他', items: ['加奶', '换燕麦奶', '去奶盖', '加珍珠', '加椰果', '加柠檬'] },
];
const DRINK_TASTE_PRESETS = DRINK_TASTE_GROUPS.flatMap(g => g.items);

const tasteModal = document.getElementById('taste-modal');
let tasteOrderId = null;
let tasteIsDrink = false;

/** 组内互斥：点中的项自动取消同组其他项；再点一次同一项则取消它 */
function toggleGroupTaste(input, group, picked) {
  let tags = parseTaste(input.value);
  // 「之前是否已选中」要看当前备注内容，而不是这个选项是否存在于组内列表
  const had = tags.indexOf(picked) >= 0;
  // 先清掉整组
  tags = tags.filter(t => !group.items.includes(t));
  // 按「之前有没有」决定是否加回，实现再次点击即取消
  if (!had) tags.push(picked);
  input.value = tags.join('，');
  return tags;
}

function openTasteModal(orderId) {
  const item = state.orders.find(o => String(o.id) === String(orderId));
  if (!item) return;
  tasteOrderId = item.id;
  // 饮品走奶茶那套预设，其余走正餐预设
  tasteIsDrink = item.slot === '饮品';
  const cur = (item.taste || '').trim();
  document.getElementById('taste-title').textContent = tasteIsDrink ? '饮品口味' : '口味备注';
  document.getElementById('taste-dish').textContent = item.dish_name || '未命名';
  const input = document.getElementById('taste-input');
  input.value = cur;
  input.placeholder = tasteIsDrink ? '例如：三分糖，少冰，加浓' : '例如：少盐、不要香菜';
  input.maxLength = 60;

  // 快捷标签：命中当前备注的高亮，可点掉取消；饮品按组分行展示
  const quick = document.getElementById('taste-quick');
  if (tasteIsDrink) {
    quick.innerHTML = DRINK_TASTE_GROUPS.map(g => `
      <div class="taste-group">
        <span class="taste-group-name">${escapeHtml(g.key)}</span>
        <div class="taste-group-items">
          ${g.items.map(t => `
            <button class="taste-chip${cur.includes(t) ? ' active' : ''}"
                    data-taste-preset="${escapeHtml(t)}"
                    data-taste-group="${escapeHtml(g.key)}" type="button">${escapeHtml(t)}</button>
          `).join('')}
        </div>
      </div>`).join('');
  } else {
    quick.innerHTML = TASTE_PRESETS.map(t => `
      <button class="taste-chip${cur.includes(t) ? ' active' : ''}"
              data-taste-preset="${escapeHtml(t)}" type="button">${escapeHtml(t)}</button>
    `).join('');
  }

  tasteModal.classList.remove('hidden');
  setTimeout(() => input.focus(), 60);
}

function closeTasteModal() {
  tasteOrderId = null;
  tasteModal.classList.add('hidden');
}

/** 把备注拆成标签数组存（逗号分隔）。正餐最多 3 个，饮品维度多，放宽到 6 个 */
function parseTaste(s) {
  return String(s || '')
    .split(/[,，、\s]+/)
    .map(x => x.trim())
    .filter(Boolean)
    .slice(0, 6);
}

async function saveTaste() {
  if (tasteOrderId === null) return;
  const raw = document.getElementById('taste-input').value.trim();
  const taste = parseTaste(raw).join('，');
  const id = tasteOrderId;
  closeTasteModal();

  const { error } = await cloud.database.from('meal_orders')
    .update({ taste }).eq('id', id);
  if (error) return toast(error.message);
  toast(taste ? `已记下：${taste}` : '已清空口味备注');
  await refresh();
}

tasteModal.addEventListener('click', async e => {
  if (e.target.closest('[data-taste-cancel]')) return closeTasteModal();

  if (e.target.closest('[data-taste-save]')) return saveTaste();
  if (e.target.closest('[data-taste-clear]')) {
    document.getElementById('taste-input').value = '';
    document.querySelectorAll('.taste-chip').forEach(c => c.classList.remove('active'));
    return;
  }

  // 快捷标签：饮品走「组内互斥」，正餐走普通多选
  const chip = e.target.closest('[data-taste-preset]');
  if (!chip) return;
  const t = chip.dataset.tastePreset;
  const input = document.getElementById('taste-input');
  const gk = chip.dataset.tasteGroup;
  const group = gk ? DRINK_TASTE_GROUPS.find(g => g.key === gk) : null;

  if (group) {
    toggleGroupTaste(input, group, t);
  } else {
    const cur = parseTaste(input.value);
    const i = cur.indexOf(t);
    if (i >= 0) cur.splice(i, 1); else cur.push(t);
    input.value = cur.join('，');
  }
  // 统一按输入框当前值刷新所有高亮状态
  const now = parseTaste(input.value);
  document.querySelectorAll('.taste-chip').forEach(c => {
    c.classList.toggle('active', now.indexOf(c.dataset.tastePreset) >= 0);
  });
});

tasteModal.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); saveTaste(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !tasteModal.classList.contains('hidden')) {
    e.stopImmediatePropagation();
    closeTasteModal();
  }
}, true);

/**
 * 菜单卡片上的「加入」：加入固定餐饮（常备清单），不再写入今日菜单。
 * 固定餐饮按餐次分组，默认加到早餐。
 */
async function addDishToFixed(dishId, slot) {
  const dish = state.dishes.find(d => d.id === Number(dishId));
  if (!dish) return;
  const target = slot || '早餐';

  // 同一道菜在同一餐次只留一条，避免重复点击堆叠
  const dup = state.fixed.find(f => f.dish_name === dish.name && f.slot === target);
  if (dup) return toast(`「${dish.name}」已经在固定${target}里了`);

  const { error } = await cloud.database.from('fixed_meals').insert({
    owner_name: me(),
    dish_id: dish.id,
    dish_name: dish.name,
    slot: target,
    sort_order: state.fixed.length + 1,
  });
  if (error) return toast(error.message);
  toast(`「${dish.name}」已加入固定${target}`);
  await refresh();
}

// =========================================================
// 渲染：固定餐饮 = 菜品库（按标签分类 + 加入当日餐饮）
// =========================================================

/**
 * 这道菜算不算饮品。
 * 判定口径：以「分类」标签为准（饮品 / 饮料 / 酒水 等），
 * 加菜页、已加入标记、点餐页饮品视图都走这里，避免各处口径不一致。
 */
const DRINK_CATS = ['饮品', '饮料', '酒水', '饮品单'];
function isDrink(dish) {
  if (!dish) return false;
  const c = String(dish.category || '').trim();
  return DRINK_CATS.includes(c);
}

/**
 * 菜品库的标签集合：自定义标签在前，菜品实际用到的分类补在后面。
 * 饮品类标签（饮品/饮料/酒水…）永远置顶固定在第一位 —— 饮品全天随时可加，
 * 是使用频率最高的一栏，不该夹在轻食/硬菜之间靠滚动去找。
 * 注意：置顶只影响显示顺序，不改动标签本身，也不影响「全部」仍是第一项。
 */
function pickCats() {
  const all = [];
  state.cats.forEach(c => { if (c.name && !all.includes(c.name)) all.push(c.name); });
  state.dishes.forEach(d => { if (d.category && !all.includes(d.category)) all.push(d.category); });

  // 先摘出饮品类，其余保持原有相对顺序，两段拼接
  const drinks = all.filter(c => DRINK_CATS.includes(String(c).trim()));
  const rest = all.filter(c => !DRINK_CATS.includes(String(c).trim()));
  const cats = [...drinks, ...rest];

  if (state.pickCat && !cats.includes(state.pickCat)) state.pickCat = '';
  return cats;
}

  const addedMeal = new Set(todayOrders.filter(o => o.slot !== '饮品').map(o => `${o.dish_id}|${o.slot}`));
  const addedDrink = new Set(todayOrders.filter(o => o.slot === '饮品').map(o => o.dish_id));

  }).join('');
}

/**
 * 把一道菜写进当日某个餐次。
 * 同一道菜在同一餐次只留一条，避免连点堆叠。
 */
async function addDishToOrder(dishId, slot) {
  const dish = state.dishes.find(d => d.id === Number(dishId));
  if (!dish) return;
  const dup = state.orders.find(o =>
    o.order_date === state.date && o.slot === slot && o.dish_name === dish.name);
  if (dup) return toast(`「${dish.name}」已经在${slot}里了`);

  // 必须取数据库真实自增 ID，前端自造临时 id 会导致后续删除/更新失败
  const { error } = await cloud.database.from('meal_orders').insert({
    owner_name: me(),
    dish_id: dish.id,
    dish_name: dish.name,
    dish_image: dish.image_data || null,
    slot,
    order_date: state.date,
    note: dish.note || '',
  });
  if (error) return toast(error.message);
  toast(slot === '饮品' ? `「${dish.name}」已加入今日饮品` : `「${dish.name}」已加入${slot}`);
  await refresh();
}

// ---- 餐次选择弹层 ----
const slotPicker = document.getElementById('slot-picker');
let pendingDishId = null;

function openSlotPicker(dishId) {
  const dish = state.dishes.find(d => d.id === Number(dishId));
  if (!dish) return;
  pendingDishId = dish.id;
  document.getElementById('slot-picker-name').textContent = dish.name;
  slotPicker.classList.remove('hidden');
}

function closeSlotPicker() {
  pendingDishId = null;
  slotPicker.classList.add('hidden');
}

document.getElementById('pick-rail').addEventListener('click', e => {
  const tab = e.target.closest('[data-pick-cat]');
  if (!tab) return;
  state.pickCat = tab.dataset.pickCat;
  renderFixed();
});

document.getElementById('pick-list').addEventListener('click', async e => {
  const btn = e.target.closest('[data-pick-add]');
  if (!btn) return;
  const dish = state.dishes.find(d => d.id === Number(btn.dataset.pickAdd));
  // 饮品全天随时可喝，直接进「饮品」区，不打扰地问是哪一餐
  if (isDrink(dish)) return addDishToOrder(dish.id, '饮品');
  openSlotPicker(btn.dataset.pickAdd);
});

slotPicker.addEventListener('click', async e => {
  if (e.target.closest('[data-slot-cancel]')) return closeSlotPicker();
  const pick = e.target.closest('[data-pick-slot]');
  if (!pick || pendingDishId === null) return;
  const dishId = pendingDishId;
  closeSlotPicker();
  await addDishToOrder(dishId, pick.dataset.pickSlot);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !slotPicker.classList.contains('hidden')) {
    e.stopImmediatePropagation();
    closeSlotPicker();
  }
}, true);

document.getElementById('back-order-btn').addEventListener('click', () => go('order'));
